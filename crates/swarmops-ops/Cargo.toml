[package]
name = "swarmops-ops"
description = "SwarmOps operations: LocalOps, the StoreOps implementation over a local store, with identity and content resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test hooks: the store's (`SWARMOPS_TEST_CRASH_AT`, `SWARMOPS_TEST_FS_CALLS`,
# `SWARMOPS_TEST_FAIL_AT`, `SWARMOPS_TEST_ORDER_CHECK`), `SWARMOPS_TEST_NOW`, the time
# `LocalOps` signs changesets at, and the git crate's (with M13's `SWARMOPS_TEST_GITHUB_HOSTS`).
# Off unless asked for.
test-hooks = [
    "swarmops-git/test-hooks",
    "swarmops-repo/test-hooks",
    "swarmops-store/test-hooks",
    "swarmops-testkit/test-hooks",
]

[dependencies]
swarmops-api = { path = "../swarmops-api", version = "0.4.0" }
swarmops-core = { path = "../swarmops-core", version = "0.4.0" }
# `git import`: the import, which reads a git repository on the caller's host through gix.
swarmops-git = { path = "../swarmops-git", version = "0.4.0" }
swarmops-repo = { path = "../swarmops-repo", version = "0.4.0" }
swarmops-store = { path = "../swarmops-store", version = "0.4.0" }
base64.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
# The store's TOML files: `remotes.toml`, `authors.toml` (M13).
toml.workspace = true

[dev-dependencies]
swarmops-testkit = { path = "../swarmops-testkit", version = "0.4.0" }
tempfile.workspace = true
