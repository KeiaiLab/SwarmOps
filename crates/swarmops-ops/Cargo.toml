[package]
name = "swarmops-ops"
description = "SwarmOps operations: LocalOps, the StoreOps implementation over a local store, with identity and content resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test hooks: the store's (`SWARMOPS_TEST_CRASH_AT`, `SWARMOPS_TEST_FS_CALLS`,
# `SWARMOPS_TEST_FAIL_AT`, `SWARMOPS_TEST_ORDER_CHECK`), `SWARMOPS_TEST_NOW`, the time
# `LocalOps` signs changesets at, and the git crate's (with M13's `SWARMOPS_TEST_GITHUB_HOSTS`).
# Off unless asked for.
test-hooks = [
    "swarmops-git/test-hooks",
    "swarmops-repo/test-hooks",
    "swarmops-store/test-hooks",
    "swarmops-testkit/test-hooks",
    "swarmops-ws/test-hooks",
]
# The serve parsers' public wrappers the fuzz targets call (`serve::cgi::fuzz_parse_path`,
# `serve::hook::fuzz_read_updates`); the parsers stay private. Off unless asked for.
fuzzing = []

[dependencies]
swarmops-api = { path = "../swarmops-api", version = "0.12.0" }
swarmops-core = { path = "../swarmops-core", version = "0.12.0" }
# `git import`: the import, which reads a git repository on the caller's host through gix.
swarmops-git = { path = "../swarmops-git", version = "0.12.0" }
swarmops-repo = { path = "../swarmops-repo", version = "0.12.0" }
swarmops-store = { path = "../swarmops-store", version = "0.12.0" }
# `check run` (M31): each check run through the workspaces' process runner, and a workspace held
# clean and locked for a run. The graph stays one-way: swarmops-ws depends on no crate that
# depends on this one (its tests take this crate's store, as a dev-dependency).
swarmops-ws = { path = "../swarmops-ws", version = "0.12.0" }
base64.workspace = true
# Native sync's land keys (`native::key`), hashed as `serve`'s are.
blake3.workspace = true
camino.workspace = true
# `check list --dir`: the check file opened without following a link or waiting on a FIFO
# (`O_NOFOLLOW`, `O_NONBLOCK`), as the store opens its lock files; already in the tree through
# swarmops-store.
libc.workspace = true
# `check run` (M31-5): a check's JUnit report, read as XML into findings.
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
# The store's TOML files, `remotes.toml` and `authors.toml` (M13), the user's login file, and
# the check file (M30), walked with its spans.
toml.workspace = true
# A run of `check run` (M31) is named by a uuid v7, so that runs sort by their start.
uuid.workspace = true

[dev-dependencies]
# The check file's round trip: definitions written by `toml`, read back (M30).
proptest.workspace = true
# `health`'s request schema, read from the type in its tests.
schemars.workspace = true
swarmops-testkit = { path = "../swarmops-testkit", version = "0.12.0" }
tempfile.workspace = true
