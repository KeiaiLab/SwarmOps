[package]
name = "swarmops-testkit"
description = "SwarmOps test support: FsOps doubles, power-loss images, the child-process runner, and the store, repository and binary builders the tests share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The runs of the `swarmops` binary and their JSON envelopes (`cli`), the git fixtures (`git`),
# and the repository builders (`repo`), default-on: the filesystem doubles (`fs`, `faults`,
# `power`) and the store's helpers need none of them, nor their dependencies (`serde_json`;
# `tar`, `base64`, `serde` and `serde_json`; `swarmops-repo`), so that the fuzz crate, a
# workspace of its own, takes this crate with `default-features = false`.
default = ["cli", "git", "repo"]
cli = ["dep:serde_json"]
git = ["dep:base64", "dep:serde", "dep:serde_json", "dep:tar"]
repo = ["dep:swarmops-repo"]
# The store's test hooks (`swarmops-store/test-hooks`), for the doubles that need them: the order
# checker of `faults::checked`. Not a default: the crates that use the test kit take it as a
# dev-dependency, and a default here would, by feature unification, build the hooks into every
# binary their tests build, the `swarmops` of the release run of `test_hooks` among them. The
# gates turn it on with `--all-features`, and the `test-hooks` of every crate that uses it
# (store, repo, ops, cli) turns it on too.
test-hooks = ["swarmops-store/test-hooks"]

# A dev-dependency of the store, the repository, the operations and the CLI. It depends on no
# crate above the repository: the operations' unit tests use it, and there a dependency on
# swarmops-ops would be a second copy of the crate under test (the store's unit tests do not use
# it, for the same reason).
[dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.2.0" }
swarmops-repo = { path = "../swarmops-repo", version = "0.2.0", optional = true }
swarmops-store = { path = "../swarmops-store", version = "0.2.0" }
base64 = { workspace = true, optional = true }
camino.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile.workspace = true
