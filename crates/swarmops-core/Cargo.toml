[package]
name = "swarmops-core"
description = "SwarmOps core: object ids, repo paths, canonical object codec (no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The integration tests are one test binary, `tests/all.rs` (see `[[test]]`).
autotests = false

[lints]
workspace = true

[features]
# Derive `arbitrary::Arbitrary` for the object types (fuzzing and property tests).
arbitrary = ["dep:arbitrary"]

[dependencies]
blake3.workspace = true
thiserror.workspace = true
hex.workspace = true
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

# One integration-test binary, one link: each file of `tests/` is a module of `tests/all.rs`,
# its tests named `<file>::<test>`. Cargo builds no other test target from `tests/`
# (`autotests = false`), so a new test file is a `mod` line there.
[[test]]
name = "all"
