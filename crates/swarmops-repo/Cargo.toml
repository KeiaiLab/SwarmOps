[package]
name = "swarmops-repo"
description = "SwarmOps repository engine: commits from change lists, reads at a revision, first-parent history, refs and verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The store's test hooks (`swarmops-store/test-hooks`), which `LocalRepo::create` and `open`
# honor: for the crash tests, which require it.
test-hooks = ["swarmops-store/test-hooks"]

[dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.1.0" }
swarmops-store = { path = "../swarmops-store", version = "0.1.0" }
camino.workspace = true
thiserror.workspace = true

[dev-dependencies]
swarmops-testkit = { path = "../swarmops-testkit", version = "0.1.0" }
tempfile.workspace = true
