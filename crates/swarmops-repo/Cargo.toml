[package]
name = "swarmops-repo"
description = "SwarmOps repository engine: commits from change lists, reads at a revision, first-parent history, refs and verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The integration tests are one test binary, `tests/all.rs` (see `[[test]]`).
autotests = false

[lints]
workspace = true

[features]
# The store's test hooks (`swarmops-store/test-hooks`), which `LocalRepo::create` and `open`
# honor: for the crash tests, which require it. It turns on the test kit's too, so that this
# crate's tests run under the order checker (`swarmops_testkit::faults::checked`) whenever they
# run with the hooks.
test-hooks = ["swarmops-store/test-hooks", "swarmops-testkit/test-hooks"]

[dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.1.0" }
swarmops-merge = { path = "../swarmops-merge", version = "0.1.0" }
swarmops-store = { path = "../swarmops-store", version = "0.1.0" }
# A land's backoff draws its jitter from a hash of its key and attempt, not from an RNG.
blake3.workspace = true
camino.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
swarmops-testkit = { path = "../swarmops-testkit", version = "0.1.0" }
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

# One integration-test binary, one link: each file of `tests/` is a module of `tests/all.rs`,
# its tests named `<file>::<test>`. Cargo builds no other test target from `tests/`
# (`autotests = false`), so a new test file is a `mod` line there.
[[test]]
name = "all"

# A land's incremental re-merge against a whole merge from its base (operations spec §9 item 1).
[[bench]]
name = "remerge"
harness = false
