# The target's check file with `site`'s inputs narrowed to `web/**`: `docs/**` is gone.
version = 1

[check.docs]
argv = ["python3", "-I", "scripts/check-docs.py"]
inputs = ["docs/**", "README.md"]

[check.site]
argv = ["just", "site-check"]
stages = ["before-land", "manual"]
inputs = ["web/**"]

[check.unit]
argv = ["cargo", "test", "--locked"]

[check.slow]
argv = ["cargo", "test", "--locked", "--", "--ignored"]
stages = ["manual"]
inputs = ["crates/**"]
