# The check file of the plan fixtures' target: four checks of two stages. `docs` and `site`
# share `docs/**`; `unit` declares no inputs and takes the whole tree; `slow` is manual alone.
version = 1

[check.docs]
argv = ["python3", "-I", "scripts/check-docs.py"]
inputs = ["docs/**", "README.md"]

[check.site]
argv = ["just", "site-check"]
stages = ["before-land", "manual"]
inputs = ["web/**", "docs/**"]

[check.unit]
argv = ["cargo", "test", "--locked"]

[check.slow]
argv = ["cargo", "test", "--locked", "--", "--ignored"]
stages = ["manual"]
inputs = ["crates/**"]
