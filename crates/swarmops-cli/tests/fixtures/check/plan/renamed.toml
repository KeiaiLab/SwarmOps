# The target's check file with `docs` renamed to `prose`: the definition is the same.
version = 1

[check.prose]
argv = ["python3", "-I", "scripts/check-docs.py"]
inputs = ["docs/**", "README.md"]

[check.site]
argv = ["just", "site-check"]
stages = ["before-land", "manual"]
inputs = ["web/**", "docs/**"]

[check.unit]
argv = ["cargo", "test", "--locked"]

[check.slow]
argv = ["cargo", "test", "--locked", "--", "--ignored"]
stages = ["manual"]
inputs = ["crates/**"]
