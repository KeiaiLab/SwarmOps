# A version 1 check file: every key, and the defaults.
version = 1

[check.unit]
argv = ["cargo", "test", "--locked"]
reports = [{ format = "junit", path = "target/nextest/default/junit.xml" }]

[check.lint]
argv = ["cargo", "clippy", "--", "-D", "warnings"]
dir = "crates/app"
timeout_s = 600
inputs = ["crates/app/**", "Cargo.toml", "Cargo.lock"]

[check.docs]
argv = ["python3", "-I", "scripts/check-docs.py"]
timeout_s = 900
stages = ["before-land", "after-land"]
