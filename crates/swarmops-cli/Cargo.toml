[package]
name = "swarmops-cli"
description = "SwarmOps CLI: the swarmops binary and so, its short form, one JSON envelope per command with a fixed exit code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The program is the library (src/lib.rs); each binary only runs it.
[[bin]]
name = "swarmops"
path = "src/main.rs"

# `so`, the short form of `swarmops`: `cargo install` installs both.
[[bin]]
name = "so"
path = "src/bin/so.rs"

[features]
# A `swarmops` and `so` that honor the test hooks (`swarmops-ops/test-hooks` turns on all of
# them): for the crash tests, which require it, never for a release.
test-hooks = ["swarmops-ops/test-hooks"]

# The crash tests drive the test hooks: without the feature, `cargo test` skips them.
[[test]]
name = "crash"
required-features = ["test-hooks"]

[dependencies]
swarmops-api = { path = "../swarmops-api", version = "0.1.0" }
swarmops-ops = { path = "../swarmops-ops", version = "0.1.0" }
camino.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.1.0" }
swarmops-repo = { path = "../swarmops-repo", version = "0.1.0" }
swarmops-store = { path = "../swarmops-store", version = "0.1.0" }
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true
