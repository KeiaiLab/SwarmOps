[package]
name = "swarmops-cli"
description = "SwarmOps CLI: the swarmops binary and so, its short form, one JSON envelope per command with a fixed exit code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The integration tests are two test binaries, `tests/all.rs` and the release proof
# `tests/test_hooks.rs` (see `[[test]]`).
autotests = false

[lints]
workspace = true

# The program is the library (src/lib.rs); each binary only runs it.
[[bin]]
name = "swarmops"
path = "src/main.rs"

# `so`, the short form of `swarmops`: `cargo install` installs both.
[[bin]]
name = "so"
path = "src/bin/so.rs"

[features]
# A `swarmops` and `so` that honor the test hooks (`swarmops-ops/test-hooks` turns on all of
# them, and the test kit's puts this crate's tests under the order checker): for the crash
# tests, which require it, never for a release.
test-hooks = [
    "swarmops-ops/test-hooks",
    "swarmops-testkit/test-hooks",
    "swarmops-ws/test-hooks",
]

# One integration-test binary, one link: each file of `tests/` is a module of `tests/all.rs`,
# its tests named `<file>::<test>`; `crash.rs` and `faults.rs` drive the test hooks, so `all.rs`
# holds them only with the feature (a plain `cargo test` skips them). Cargo builds no other test
# target from `tests/` (`autotests = false`), so a new test file is a `mod` line there.
[[test]]
name = "all"

# The release proof, a binary of its own: `just check` builds and runs it without the feature,
# in release, as `cargo build --release` builds the binaries.
[[test]]
name = "test_hooks"

[dependencies]
swarmops-api = { path = "../swarmops-api", version = "0.5.0" }
swarmops-ops = { path = "../swarmops-ops", version = "0.5.0" }
# The workspaces (M5): `so ws`, its hooks and the MCP server's workspace tools.
swarmops-ws = { path = "../swarmops-ws", version = "0.5.0" }
camino.workspace = true
clap.workspace = true
# A store's memo key, made on first use (`context::memo_key`).
getrandom.workspace = true
serde.workspace = true
# `swarmops mcp` reads a message line's members as their JSON text (`RawValue`), so that it
# parses only what it serves and nothing else a line holds.
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.5.0" }
# `git export`'s tests read what it wrote back through the git side (`GixSource`), and make a
# commit in git through it (`GixSink`).
swarmops-git = { path = "../swarmops-git", version = "0.5.0" }
swarmops-repo = { path = "../swarmops-repo", version = "0.5.0" }
swarmops-store = { path = "../swarmops-store", version = "0.5.0" }
swarmops-testkit = { path = "../swarmops-testkit", version = "0.5.0" }
assert_cmd.workspace = true
insta.workspace = true
# The power-loss tests record a run on a one-thread pool, so that it makes its calls in the
# same order every time.
rayon.workspace = true
tempfile.workspace = true
