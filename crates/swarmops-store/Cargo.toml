[package]
name = "swarmops-store"
description = "SwarmOps store: loose object files and the native metadata store (journal, changeset index, refs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The integration tests are one test binary, `tests/all.rs` (see `[[test]]`).
autotests = false

[lints]
workspace = true

[features]
# The test hooks, `SWARMOPS_TEST_CRASH_AT`, `SWARMOPS_TEST_FS_CALLS`, `SWARMOPS_TEST_FAIL_AT`
# and `SWARMOPS_TEST_ORDER_CHECK`, which `HookedFs::from_env` reads, and the fault doubles they
# build (`CrashAtFs`, `FailAtFs`, `OrderCheckFs`). Off unless asked for, so that every other
# build (a release build included) ignores them and holds no such double; the workspace's gates
# turn it on with `--all-features`. It turns on the test kit's too, so that this crate's tests run
# under the order checker (`swarmops_testkit::faults::checked`) whenever they run with the hooks.
test-hooks = ["swarmops-testkit/test-hooks"]

[dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.4.0" }
blake3.workspace = true
camino.workspace = true
crc32fast.workspace = true
libc.workspace = true
rayon.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zstd.workspace = true

# The filesystem check reads `statfs` through a safe API.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The integration tests' and benches' support; no unit test uses it (it depends on this crate).
swarmops-testkit = { path = "../swarmops-testkit", version = "0.4.0" }
criterion.workspace = true
proptest.workspace = true

# One integration-test binary, one link: each file of `tests/` is a module of `tests/all.rs`,
# its tests named `<file>::<test>`. Cargo builds no other test target from `tests/`
# (`autotests = false`), so a new test file is a `mod` line there.
[[test]]
name = "all"

[[bench]]
name = "fsync_latency"
harness = false

[[bench]]
name = "put_batch"
harness = false

[[bench]]
name = "index_lookup"
harness = false

[[bench]]
name = "fsync_fanout"
harness = false

[[bench]]
name = "read_snapshot"
harness = false

[[bench]]
name = "compaction"
harness = false

[[bench]]
name = "history"
harness = false
