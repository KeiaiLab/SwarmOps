[package]
name = "swarmops-store"
description = "SwarmOps store: loose object files and the native metadata store (journal, changeset index, refs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test hooks, `SWARMOPS_TEST_CRASH_AT`, `SWARMOPS_TEST_FS_CALLS`, `SWARMOPS_TEST_FAIL_AT`
# and `SWARMOPS_TEST_ORDER_CHECK`, which `HookedFs::from_env` reads, and the fault doubles they
# build (`FailAtFs`, `OrderCheckFs`). Off unless asked for, so that every other build (a release
# build included) ignores them and holds no such double; the workspace's gates turn it on with
# `--all-features`.
test-hooks = []

[dependencies]
swarmops-core = { path = "../swarmops-core", version = "0.1.0" }
camino.workspace = true
crc32fast.workspace = true
rayon.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "fsync_latency"
harness = false

[[bench]]
name = "put_batch"
harness = false

[[bench]]
name = "index_lookup"
harness = false

[[bench]]
name = "fsync_fanout"
harness = false

[[bench]]
name = "read_snapshot"
harness = false
