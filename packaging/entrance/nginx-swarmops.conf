# git's three smart HTTP paths at the root, as https://so-host/<store>.git, through fcgiwrap
# running as the serving account (docs: Serve over HTTP, "nginx and fcgiwrap"). Every request
# needs a web login; the planted misconfiguration of the self-check turns it off.
server {
    listen 127.0.0.1:443 ssl;
    server_name so-host;
    ssl_certificate /etc/swarmops-entrance/tls.pem;
    ssl_certificate_key /etc/swarmops-entrance/tls.key;

    location ~ ^(/[^/]+/(?:info/refs|git-upload-pack|git-receive-pack))$ {
        auth_basic "SwarmOps";
        auth_basic_user_file /etc/swarmops-entrance/htpasswd;
        client_max_body_size 0;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/libexec/swarmops-serve.cgi;
        fastcgi_param PATH_INFO $1;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/swarmops/fcgiwrap.socket;
    }

    location / {
        return 404;
    }
}
