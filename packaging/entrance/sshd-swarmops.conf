# sshd for the serving account alone, keys only; git's protocol request passes through
# (docs: Serve over ssh, "Let protocol v2 through"). Read before sshd_config's own lines, so
# these win.
ListenAddress 127.0.0.1
AllowUsers so
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AcceptEnv GIT_PROTOCOL
