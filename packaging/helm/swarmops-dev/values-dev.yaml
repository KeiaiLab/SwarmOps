# The dev overlay (devspace.yaml deploys it). swarmops.devNamespaceGuard refuses any other namespace.
dev:
  namespace: swarmops-dev
  # the so-sandbox CI runner image (platform/system images/so-sandbox-runner): rustup, git, python3, build-essential,
  # the Nexus crate proxy config. Pinned by digest; move it with the system image.
  image: harbor.keiailab.com/keiailab/platform/system/so-sandbox-runner:a4dd169ac1b9@sha256:1bf443cf024d1ee5f3bebf3c52f913aae67983bc7ae96449a8d8b80724ae631c
  # the build node (NVMe, the so-sandbox runners' node)
  node: e122
  # e122 is tainted keiailab.dev/dedicated=restartable (same toleration as so-sandbox).
  tolerations:
    - {key: keiailab.dev/dedicated, operator: Equal, value: restartable, effect: NoSchedule}
  resources:
    requests: {cpu: "1", memory: 8Gi, ephemeral-storage: 4Gi}
    limits: {cpu: "16", memory: 48Gi, ephemeral-storage: 30Gi}
  buildJobs: "12"
  testThreads: "12"
  storage:
    # cargo target/ — never on the Mac, never on NFS. Kept across `devspace run down` (resource-policy keep).
    target: {storageClassName: ceph-rbd, size: 200Gi}
    # CARGO_HOME (registry cache, installed tools) and RUSTUP_HOME
    cargoHome: {storageClassName: ceph-rbd, size: 40Gi}
    # long-term keep: fuzz corpus and measurement logs (Synology). Not a build directory.
    archive: {storageClassName: nas-nfs, size: 200Gi}
  sccache:
    # CI's bucket (OBC rook-ceph/swarmops-sccache, ceph-rgw-keiailab), keys copied by ExternalSecret.
    # This is a compiler-output cache for cargo, not an image-bake (BuildKit/ship-build) cache: the
    # "no Ceph PVC / S3 build cache" rule of the image bakes does not cover it, and no bake Job uses it.
    bucket: swarmops-sccache
    endpoint: http://rook-ceph-rgw-keiailab-rgw.rook-ceph.svc:80
    secretStore: cluster-internal-k8s-rook-ceph
    sourceSecret: swarmops-sccache
    secretName: swarmops-sccache
    region: us-east-1
    keyPrefix: swarmops/
    cacheSize: 50G
  rustupDistServer: https://pkg.keiailab.com/repository/raw-rust
  # tool versions installed into CARGO_HOME by scripts/dev-pod.sh (ci.yml pins the same just/nextest/deny)
  tools:
    just: 1.58.0
    nextest: 0.9.146
    deny: 0.20.2
    sccache: 0.20.1
