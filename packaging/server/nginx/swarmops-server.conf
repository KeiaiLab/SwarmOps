# The installation's web site: plain HTTP only redirects and answers ACME challenges; HTTPS
# serves the root page so-kit writes and git's smart HTTP for one store per path.
# The TLS files are the operator's ACME client's; it answers challenges from the acme directory.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/cache/swarmops-server/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/swarmops-server/tls/fullchain.pem;
    ssl_certificate_key /etc/swarmops-server/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/cache/swarmops-server/www;

    # The root page: host key fingerprints, the release, the operator's texts.
    location = / {
        try_files /index.html =404;
    }

    # git's three smart HTTP requests on one store, by a web login (person/<login>).
    location ~ "^(/[a-z0-9][a-z0-9._-]{0,62}/(?:info/refs|git-upload-pack|git-receive-pack))$" {
        auth_basic "SwarmOps";
        auth_basic_user_file /etc/swarmops-server/web.htpasswd;
        client_max_body_size 0;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/swarmops-server/swarmops-serve.cgi;
        fastcgi_param PATH_INFO $1;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/swarmops-server/fcgiwrap.socket;
    }

    location / {
        return 404;
    }
}
