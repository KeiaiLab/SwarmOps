# The backup's and the restore drill's settings, read by so-backup. One `key=value` a line; a
# key so-backup does not know is refused. Paths are absolute; root and swarmops come from the
# kit's kit.conf.

# The bucket: an S3-compatible endpoint (https), its region and the bucket's name.
backup_endpoint=
backup_region=auto
backup_bucket=
# A file of `access_key_id=` and `secret_access_key=` lines: the serving credential (writes
# backups/, reads rehearsal/records/) or, where the drill runs, the rehearsal one.
backup_credential=
# The two recipients' X.509 certificates: the recovery key (its private half offline) and the
# rehearsal key. The rehearsal key's private half, only where the drill runs.
backup_recovery_recipient=
backup_rehearsal_recipient=
backup_rehearsal_key=
# The secret files a backup carries as a part of their own, `:`-separated.
backup_secrets=
# Seconds within which a rehearsal record must exist: a week and a day.
backup_rehearsal_period=691200
# The alert program, called `<fail | test> <message>`.
backup_alert=
