# sshd for the serving account: keys alone, each key line's forced command, git's protocol
# variable and nothing else from the client.
Match User so
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /var/lib/swarmops-server/.ssh/authorized_keys
    AcceptEnv GIT_PROTOCOL
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
# Ends the block, so that no directive of a later file applies to the account alone.
Match all
