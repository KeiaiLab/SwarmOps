# The acceptance program's settings, read by `so-kit run accept`. One `key=value` a line; a
# key it does not know is refused. Paths are absolute; root and swarmops come from kit.conf.

# The installation as its clients reach it: host name, ssh port, HTTPS port.
accept_host=localhost
accept_ssh_port=22
accept_https_port=443
# The acceptance repository: it exists, and its access.toml lets the identity read, push and
# land onto main. The identity is person/<login>: its key line names it, and <login> is its
# web login.
accept_store=accept
accept_identity=person/accept
# The identity's private ssh key, owned by the account the program runs as, mode 0600 or 0400;
# a file holding the web login's password (letters and digits); the certificate that signs the
# installation's TLS certificate (empty: the system's trust store).
accept_key=
accept_password=
accept_ca=
# Where each run makes its scratch directory, removed at the end.
accept_work=/tmp
