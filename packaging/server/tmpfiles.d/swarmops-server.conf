# The kit's directories and files: stores, the account's home, its key lines, the root page,
# settings, secrets, the web password file, TLS and ACME files.
d /srv/so 0700 so so -
d /var/lib/swarmops-server 0700 so so -
d /var/lib/swarmops-server/.ssh 0700 so so -
f /var/lib/swarmops-server/.ssh/authorized_keys 0600 so so -
d /var/cache/swarmops-server 0755 root root -
d /var/cache/swarmops-server/www 0755 so so -
d /var/cache/swarmops-server/acme 0755 root root -
d /etc/swarmops-server 0755 root root -
d /etc/swarmops-server/secrets 0700 so so -
d /etc/swarmops-server/tls 0700 root root -
f /etc/swarmops-server/web.htpasswd 0640 root swarmops-web -
