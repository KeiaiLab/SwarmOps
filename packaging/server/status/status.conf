# The status probe's and page's settings, read by so-status. One `key=value` a line; a key
# so-status does not know is refused; a later line wins. Paths are absolute.

# The probe repository's addresses, one per entrance; an empty one is not probed. The probe
# lands a commit on its main every try: give it a repository of its own.
ssh_url=
https_url=
# The probe's ssh key and the host keys it trusts; empty: ssh's own settings.
ssh_key=
known_hosts=
# A file holding the probe's HTTPS password; empty: none.
https_password=
# Seconds between tries, and the most one step of a try may take.
period=60
try_limit=45
# How many records are kept, newest first: a week of tries a minute.
keep=10080
records=/var/lib/swarmops-status/records
# Where the page is written, with the records it was made from.
page=/var/lib/swarmops-status/www
# A page whose newest try is older than this many seconds reads stale.
stale_after=900
# The backup job's records; empty: the page shows no backup.
backups=
# The backup period in seconds (the work at risk), and the copies a backup leaves.
backup_period=3600
copies=1
