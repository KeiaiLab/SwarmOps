# The server kit's settings, read by so-kit. One `key=value` a line; a key so-kit does not
# know is refused. Paths are absolute.

# The directory that holds one store per repository.
root=/srv/so
# The swarmops binary the key lines and the root page name.
swarmops=/usr/bin/swarmops
# The directory of the host's ssh_host_*_key.pub files, whose fingerprints the root page shows.
host_keys=/etc/ssh
# Where the root page is written; the nginx site serves it.
web_root=/var/cache/swarmops-server/www
# The serving account's key lines.
authorized_keys=/var/lib/swarmops-server/.ssh/authorized_keys
# The web server's account, given the group that may reach the CGI socket by `so-kit setup`.
web_user=www-data
# The operator's texts the root page shows, plain text files; empty shows none.
terms=
privacy=
acceptable_use=

# The container roles (`so-kit run <role>`): the ports sshd and the web server listen on, TLS
# only (a package host's sshd and nginx keep 22, 80 and 443); where the rendered configurations,
# pid files and the CGI socket go; the periodic jobs, which the units' timers start too; the
# rehearsal and acceptance programs.
ssh_port=2222
https_port=8443
run_dir=/run/swarmops-server
jobs=/usr/lib/swarmops-server/jobs
rehearse=/usr/lib/swarmops-server/backup/rehearse
accept=/usr/lib/swarmops-server/accept/accept
# `so-kit run setup` creates each store a `store=<name> <family>/<instance>` line names, the
# identity reading and landing onto main, and leaves an existing store as it is. Repeated.
