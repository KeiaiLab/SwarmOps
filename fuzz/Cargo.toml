[package]
name = "swarmops-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[lib]
# Helpers shared by the journal targets.
path = "src/lib.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.5.0", features = ["derive"] }
crc32fast = "1.5.2"
# The workspace's crates, at its version (RELEASE.md bumps it here too): cargo deny refuses a
# dependency without a version requirement, a path one included.
swarmops-core = { path = "../crates/swarmops-core", version = "0.3.0", features = ["arbitrary"] }
swarmops-store = { path = "../crates/swarmops-store", version = "0.3.0" }
# The filesystem doubles only (`NoSyncFs`): without its default features, which hold the CLI
# and repository helpers, it adds no dependency the store does not have.
swarmops-testkit = { path = "../crates/swarmops-testkit", version = "0.3.0", default-features = false }
tempfile = "3.27.0"

[[bin]]
name = "codec_roundtrip"
path = "fuzz_targets/codec_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_decode"
path = "fuzz_targets/tree_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_recovery"
path = "fuzz_targets/journal_recovery.rs"
test = false
doc = false
bench = false

# Own workspace: `just fuzz` builds and runs it with nightly; `just check` (and
# scripts/check.sh) formats and lints it with stable.
[workspace]
