# This repository's checks (M30): the commands its gate runs, one argv each, run with no shell.
# `just check` lists them with the build under test (`check list --dir .`), so a file that does not
# parse fails the gate. Each timeout is its job's `timeout-minutes` in the workflow file, the two
# `before-land` checks sharing the check job's; no run was measured.
#
# Stages: `before-land` is the gate, what ci.yml's `check` job runs and what
# `so check run --dir . --stage before-land` runs before a push. The `manual` checks run on
# GitHub, in their own jobs, as before; later steps of M30 and M31 give them stages of their own.
# Every check writes its stages out, the default too.
version = 1

# ci.yml, job `check`: the definition of done. Both before-land checks run one after the other in
# that job's 30 minutes, after its checkout and tool steps: 23 min 40 s + 5 min, plus the runner's
# grace and drain after each check's kill (6 s each), leaves a minute for those steps, so that a
# hung check ends with its own timeout, its log and its tails, not with the job's kill. Not
# measured: neither the gate's time nor the steps' is taken from a run yet; both are to be read
# from the runners' recent runs before ci.yml switches to `check run`. If the gate outgrows this,
# it moves, or the job's limit does. The test `check::this_repository_s_gate_fits_its_job` holds
# the timeouts, the grace and drain and the minute to the job.
[check.check]
argv = ["just", "check"]
timeout_s = 1420
stages = ["before-land"]
# nextest's `ci` profile writes its JUnit report here (.config/nextest.toml); `just check` copies
# it here from a CARGO_TARGET_DIR elsewhere when a nextest wrote it there. check run reads it
# after the check, if this run wrote it: each failed test a finding (M31-5).
reports = [{ format = "junit", path = "target/nextest/ci/junit.xml" }]

# ci.yml, job `check`, after it: bench/compare still compiles against the store's API.
[check.check-compare]
argv = ["just", "check-compare"]
timeout_s = 300
stages = ["before-land"]

# ci.yml, job `zizmor`: actionlint over every workflow, and tests-pass needing every other job.
# The zizmor audit itself stays a step of that job. Manual: it downloads a Linux x86_64 actionlint,
# and the check job would run it twice.
[check.lint-workflows]
argv = ["just", "lint-workflows"]
timeout_s = 600
stages = ["manual"]

# site.yml, job `site`, on the paths it scopes: the site built and checked (node, npm's registry).
[check.site-check]
argv = ["just", "site-check"]
timeout_s = 900
stages = ["manual"]

# server.yml, job `entrances`, on its paths and weekly: stock git and so through sshd and nginx
# (docker).
[check.server-entrances]
argv = ["just", "server-entrances"]
timeout_s = 1800
stages = ["manual"]

# server.yml, job `acceptance`: the packages installed and accepted.
[check.server-acceptance]
argv = ["just", "server-acceptance"]
timeout_s = 2700
stages = ["manual"]
