[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/KeiaiLab/SwarmOps"
# No crate goes to crates.io before a release policy has been exercised (RELEASE.md).
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
thiserror = "2.0.21"
hex = "0.4"
proptest = "1.12.0"
arbitrary = { version = "1.5.0", features = ["derive"] }
criterion = "0.8.2"
tempfile = "3.27.0"
# The git fixtures' archives (swarmops-testkit only); no xattrs, which they never carry.
tar = { version = "0.4.46", default-features = false }
# The git import's reader (swarmops-git only, behind its `GitSource`): pinned exactly, SHA-1
# only, no default features (umbrella decision 3).
gix = { version = "=0.89.0", default-features = false, features = ["sha1"] }
# Without the default features: none of the legacy-format (v0.1-v0.7) decoders, which an object
# file could reach, and no dictionary builder. The store writes and reads frames of the current
# format only (storage spec §2 rule 1).
zstd = { version = "0.14.2", default-features = false }
imara-diff = "0.2.0"
# The three-way text merge's in-process oracle (swarmops-merge's tests only; storage §9).
diffy = "0.5.2"
rayon = "1.12.0"
camino = "1.2.6"
crc32fast = "1.5.2"
# The flags `meta/lock` is opened with, `O_NOFOLLOW` and `O_NONBLOCK` (swarmops-store only): its
# constants, which std does not name; no call. The version tempfile already brings in.
libc = "0.2.190"
# Derived values only (storage §5): never the journal, and never a hashed object (§1).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
base64 = "0.22.1"
# The store's TOML files (M13's `remotes.toml` and `authors.toml`, swarmops-ops only): parse and
# write through serde, no `preserve_order`; MIT OR Apache-2.0, as its two new crates
# (serde_spanned, toml_writer) are.
toml = { version = "1.1.6", default-features = false, features = ["parse", "display", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
# The workspaces' untracked walk (swarmops-ws only, M5 decision 6): gitignore-aware and
# parallel, with globset beside it; both "Unlicense OR MIT", which deny.toml's MIT admits.
ignore = "0.4.33"
# The keys a workspace gives its store calls (swarmops-ws only): uuid v7, as `--key` takes;
# "Apache-2.0 OR MIT".
uuid = { version = "1.28.0", features = ["v7"] }
# A check's process group, killed when it runs past its time (swarmops-ws only, Unix): `kill(2)`
# with a negative pid through a safe API. The version tempfile already brings in; no new package.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
insta = { version = "1.49.0", features = ["json"] }
assert_cmd = "2.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
# Every exported item has a doc comment. A warning, as `pedantic` is: `just check` denies
# warnings in clippy and rustdoc, so it fails there, while a local build of a draft still runs.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints that fight product names and API docs; everything else in pedantic stays on.
doc_markdown = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
