name: Bug report
description: SwarmOps did something wrong, or failed in a way it should not.
labels: ["kind: bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security vulnerability does not belong here: [SECURITY.md](https://github.com/KeiaiLab/SwarmOps/blob/stable/SECURITY.md) says how to report one privately. Check [docs/known-limitations.md](https://github.com/KeiaiLab/SwarmOps/blob/stable/docs/known-limitations.md) first: the problem may be known already.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The commands you ran and the JSON envelope each printed (`error.code`, `details` and `hint` matter most). Put commands and their output between ``` lines. Remove paths or content you cannot share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `swarmops --version` prints.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: What `uname -srm` prints.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: verify
    attributes:
      label: "`swarmops verify --deep`"
      description: What `swarmops verify --deep` prints on the affected store, if a store is involved.
      render: json
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of SwarmOps it concerns. Leave it empty if you are not sure.
      options:
        - store
        - cli
        - mcp
        - git
        - remote
        - workspace
        - install
        - docs
        - site
  - type: dropdown
    id: crash
    attributes:
      label: Did anything interrupt SwarmOps first?
      options:
        - "No"
        - A process was killed (kill -9, OOM, timeout)
        - Power loss, or a VM or WSL reset
        - The disk was full, or reported I/O errors
        - Not sure
  - type: input
    id: commit
    attributes:
      label: SwarmOps commit
      description: For a binary built from source, what `git rev-parse --short HEAD` prints in that checkout.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The store's filesystem, as `stat -f -c %T <store>` prints it, and how many processes or agents shared the store.
