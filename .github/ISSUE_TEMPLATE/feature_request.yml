name: Feature request
description: Something SwarmOps should do, or do differently.
labels: ["kind: feature"]
body:
  - type: markdown
    attributes:
      value: |
        [docs/roadmap.md](https://github.com/KeiaiLab/SwarmOps/blob/stable/docs/roadmap.md) may already plan what you need, and [docs/known-limitations.md](https://github.com/KeiaiLab/SwarmOps/blob/stable/docs/known-limitations.md) lists what is still open.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you, or your agents, are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behaviour you want. Commands, requests and envelopes help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: surfaces
    attributes:
      label: Public surfaces it would change
      description: See docs/policies/versioning-and-stability.md.
      options:
        - label: The hash contract (object layouts or ids)
        - label: The store format (FORMAT)
        - label: The CLI's commands, envelope or error codes
        - label: The API schema or the MCP tools
