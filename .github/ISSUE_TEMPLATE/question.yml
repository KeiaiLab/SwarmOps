name: Question
description: A question about using or running SwarmOps.
labels: ["kind: question"]
body:
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/KeiaiLab/SwarmOps/blob/stable/README.md), the [quick start](https://github.com/KeiaiLab/SwarmOps/blob/stable/docs/guides/quick-start.md) and [Operating SwarmOps](https://github.com/KeiaiLab/SwarmOps/blob/stable/docs/operations.md) may answer it already.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you ran. Commands and the JSON envelopes they printed help.
    validations:
      required: true
