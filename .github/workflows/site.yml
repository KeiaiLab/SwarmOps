# The website (web/): builds the static export and checks it on every push that can change it,
# then deploys web/out to Cloudflare Pages, project `swarmops`. A push to stable is production
# (swarmops.cc), a push to a feat/** branch a preview on its pages.dev address; a pull request
# builds and checks only. Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the
# deploy job leaves a notice and deploys nothing, so the run stays green.
#
# Hardening as in ci.yml: every action pinned to a full commit SHA (its version in the trailing
# comment), no token permission a job does not need (the deploy job alone may write deployments,
# the GitHub record of each Pages deploy), `actions/checkout` keeps no credentials, no
# `pull_request_target`; ci.yml's zizmor job audits this file too.
#
# Where jobs run: as in ci.yml, on the maintainers' own host, through the self-hosted runners
# labelled `swarmops-local`; a pull request from a fork is built and checked on ubuntu-24.04.
name: Site

on:
  push:
    branches: [stable, "feat/**"]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/install.sh"
      - "justfile"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [stable]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/install.sh"
      - "justfile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  site:
    name: build and check the site
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "swarmops-local"]') || 'ubuntu-24.04' }} # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read # checkout
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
          # Only the action's checksummed release binaries, never a cargo-binstall fallback.
          fallback: none
      - run: just web-install
      - run: just web-build
      - run: just web-check

      # The checked export, for the deploy job. Hidden files included: .well-known/security.txt.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy to Cloudflare Pages
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    # The secrets are read in an environment of their own: production for stable, preview for
    # every other branch. Neither has protection rules; the URL is the deploy's address.
    environment:
      name: ${{ github.ref_name == 'stable' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read # read-only, as in every job here; no checkout, the artifact is this run's
      deployments: write # wrangler-action records each deploy, with its URL, as a GitHub deployment
    timeout-minutes: 10
    steps:
      # 1. No secrets, no deploy: a notice, and the job still succeeds.
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=Site not deployed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the site was built and checked, nothing was deployed."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      # 2. The export the site job checked, byte for byte.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: web/out

      # 3. Node for wrangler: a self-hosted runner's PATH does not reach JavaScript actions, so
      # the deploy pins the same Node as the site job.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
          # No cache: nothing restored can reach the job that holds the deploy token.
          package-manager-cache: false

      # 4. The deploy. The project's production branch is stable: `--branch stable` is
      # production, any other branch a preview. _headers and _redirects in web/out apply.
      - id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          wranglerVersion: 4.151.3
          command: pages deploy web/out --project-name=swarmops --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
