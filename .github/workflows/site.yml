# The website (web/): builds the static export and checks it on every push that can change it. No
# deploy yet: production still serves site/.
#
# Hardening as in ci.yml: every action pinned to a full commit SHA (its version in the trailing
# comment), no token permission beyond reading the repository, `actions/checkout` keeps no
# credentials, no `pull_request_target`; ci.yml's zizmor job audits this file too.
name: Site

on:
  push:
    branches: [stable, "feat/**"]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/install.sh"
      - "site/**"
      - "justfile"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [stable]
    paths:
      - "web/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/install.sh"
      - "site/**"
      - "justfile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  site:
    name: build and check the site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
          # Only the action's checksummed release binaries, never a cargo-binstall fallback.
          fallback: none
      - run: just web-install
      - run: just web-build
      - run: just web-check
