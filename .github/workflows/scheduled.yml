# What is too slow for every push, weekly and on demand: `just check-ci-slow` (the regular suite
# at 2,000 proptest cases plus the ignored slow tests, crash sweeps included, without the
# 32-process contention measurements and the 12,000-commit measurement cases), a 60-second fuzz
# smoke of every fuzz target on nightly, the cargo-deny check, formatting, lints and tests of bench/compare, a workspace of its own
# that `just check` does not build, and the git version matrix, which rebuilds the git fixtures
# with three gits, runs the git import's tests on what each made, has each check the git
# export's repositories with `git fsck`, and runs the remote suites (fetch, push, sync over smart
# HTTP and ssh) with each; the round trip of mirrors of this host's repositories; the live
# run with GitHub, once a repository variable names its
# scratch repository; alone, the benchmark gate; and, last and alone, those measurement cases,
# optimized. Hardened as ci.yml is, and run where it runs: on the maintainers' own host,
# through the self-hosted runners labelled `swarmops-local`, each building into its runner's
# persistent CARGO_TARGET_DIR, so no build cache travels through GitHub.
# `just check-ci-slow` runs first and alone: its runners share one host, and next to the git
# matrix and the fuzz smoke (load 319 on 32 cores) clone_cost_on_12000_commits, in the suite
# then, ran into its 20-minute kill: 1,048 s within the suite the run before, 721 s by itself.
# The other jobs wait for it, pass or fail.
# The git matrix alone runs in a container on that host, so that it needs none of its packages.
name: Scheduled

on:
  schedule:
    # Mondays at 03:17 UTC: not on the hour, the busiest time, when GitHub delays scheduled runs.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  slow:
    name: just check-ci-slow
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # The ci profile with a 20-minute kill for a hung test (.config/nextest.toml); its JUnit
      # report is target/nextest/ci-slow/junit.xml.
      NEXTEST_PROFILE: ci-slow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
          fallback: none
      - run: just check-ci-slow
      # The runner builds into its own CARGO_TARGET_DIR: bring the report to target/.
      - name: Collect the JUnit report
        if: ${{ !cancelled() }}
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -f "$CARGO_TARGET_DIR/nextest/ci-slow/junit.xml" ]; then
            mkdir -p target/nextest/ci-slow
            cp "$CARGO_TARGET_DIR/nextest/ci-slow/junit.xml" target/nextest/ci-slow/
          fi
      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-slow
          path: target/nextest/ci-slow/junit.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  fuzz:
    name: fuzz smoke
    needs: slow
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
          fallback: none
      # install-action has no checksummed cargo-fuzz, so the pinned release is built from
      # crates.io with its own lockfile.
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      # Every target runs even when one fails; `cargo fuzz list` reads fuzz/Cargo.toml, so a
      # target added there joins the smoke. The recipe's `-timeout=30` fails an input that runs
      # for more than 30 s, so a hang ends long before the job's timeout and its input is uploaded.
      - name: Run every fuzz target for 60 seconds
        run: |
          targets=$(cargo +nightly fuzz list)
          [ -n "$targets" ] || { echo "::error::cargo fuzz list found no target"; exit 1; }
          failed=()
          for target in $targets; do
            echo "::group::just fuzz $target"
            just fuzz "$target" || failed+=("$target")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::fuzz targets that failed: ${failed[*]}"
            exit 1
          fi
      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  bench-compare:
    name: bench/compare
    needs: slow
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # The comparison harness is a cargo workspace and lockfile of its own, outside `just check`,
      # on swarmops-core and swarmops-store as path dependencies: this is the only automated build
      # that notices a change to either breaking `just bench-compare`. The commands are the ones
      # its README names: `cargo deny` first, which checks the lockfile with the harness's own
      # policy (bench/compare/deny.toml) before anything of it is built, then fmt, clippy and
      # test. No cache: about a hundred crates, SQLite's C sources among them, once a week.
      - run: cargo deny --locked --manifest-path bench/compare/Cargo.toml --config bench/compare/deny.toml check
      - run: cargo fmt --manifest-path bench/compare/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path bench/compare/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path bench/compare/Cargo.toml

  # The git fixtures (crates/swarmops-testkit/git-fixtures/) rebuilt by three gits: 2.39.5, the
  # oldest the import is tried with; 2.43.0, which makes the committed archives
  # (git-fixtures/GIT_VERSION); and 2.56.0, the newest 2.x on 2026-10-19, moved by hand. Each git
  # is built from kernel.org's release tarball, checked against the SHA-256 that kernel.org's
  # signed sha256sums.asc gives, and cached by release. `check_git_fixtures` rebuilds every
  # fixture into $RUNNER_TEMP/fx and names each difference from the archives' manifests (a script
  # that git is too old for, `# needs git X.Y`, is skipped and said to be); the tests of the
  # testkit's fixtures and of the git import then run on those fixtures instead of the archives.
  # Last, this git checks the git export's repositories: the committed archives, imported, landed
  # on and exported into an empty repository, pass its `git fsck --strict` (M8 Task 9). And the
  # remote suites run with this git as the product's (M13): built with curl, so that it speaks
  # smart HTTP to the test kit's loopback server.
  # Inside ubuntu:24.04 pinned by digest, as root, as release.yml's build jobs are: the job
  # installs the compiler, zlib's and curl's headers and the pinned toolchain itself, so it needs
  # nothing of the runner's host; the last step gives the runner's user back what it wrote into
  # the mounted workspace and temporary directory. The toolchain, the build and git's install
  # prefix stay in the container's own filesystem. The digest and the rustup-init release are
  # moved by hand, with release.yml's.
  git-matrix:
    name: git matrix (${{ matrix.git }})
    needs: slow
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - git: 2.39.5
            sha256: c58da92c378df4a986ca33266897a7397e86c22ee266a284d8c2432c39066b59
          - git: 2.43.0
            sha256: 5446603e73d911781d259e565750dcd277a42836c8e392cac91cf137aa9b76ec
          - git: 2.56.0
            sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      CARGO_TARGET_DIR: /opt/target
      DEBIAN_FRONTEND: noninteractive
      # The git under test; built with the prefix it runs from, which git compiles in.
      GIT_PREFIX: /opt/git
      # rustup-init, the release the steps install, by the SHA-256 static.rust-lang.org gives.
      RUSTUP_RELEASE: 1.29.2
      RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
    steps:
      # Ubuntu's git (2.43.0) before the checkout, which otherwise downloads the tree without its
      # history, and on PATH for the tests that find git there, as the host's was. zlib's,
      # OpenSSL's and curl's headers are what git's build needs beyond the compiler: without what
      # the tests do not use (Tcl/Tk, gettext, Perl, Python, expat); curl for git's HTTP
      # transport, which the remote suites run.
      - name: Install the compiler, git's build dependencies and the tools the steps run
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates curl \
            git libcurl4-openssl-dev libssl-dev xz-utils zlib1g-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also the default toolchain: git 2.56.0 builds Rust code with cargo, outside the
      # checkout's rust-toolchain.toml.
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_RELEASE/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $init" | sha256sum --check --strict -
          chmod +x "$init"
          "$init" -y --no-modify-path --profile minimal --default-toolchain none
          rm -f -- "$init"
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "$CARGO_HOME/bin" >>"$GITHUB_PATH"
          rustup toolchain install --no-self-update
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      # The install prefix is the cache, by release and tarball; the job saves it when it passes.
      - name: Restore git ${{ matrix.git }}, built before
        id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/git
          # `-curl`: a git built before the remote suites, without curl, is never restored.
          # `-container`: nor one built on the host, under a prefix this container lacks.
          key: git-${{ matrix.git }}-${{ matrix.sha256 }}-curl-ubuntu-24.04-container
      # Without the job's CARGO_TARGET_DIR: git 2.56.0's cargo would build libgitcore.a there,
      # and its Makefile links target/release/libgitcore.a of its own tree.
      - name: Build git ${{ matrix.git }} from kernel.org's release tarball
        if: steps.git-cache.outputs.cache-hit != 'true'
        env:
          GIT_RELEASE: ${{ matrix.git }}
          GIT_SHA256: ${{ matrix.sha256 }}
        run: |
          tarball="$RUNNER_TEMP/git-$GIT_RELEASE.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_RELEASE.tar.xz"
          echo "$GIT_SHA256  $tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/git-src"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/git-src" --strip-components=1
          env -u CARGO_TARGET_DIR make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" \
            prefix="$GIT_PREFIX" NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_EXPAT=1 install
      - name: Rebuild every fixture with git ${{ matrix.git }} and compare the manifests
        run: |
          "$GIT_PREFIX/bin/git" --version
          SWARMOPS_GIT="$GIT_PREFIX/bin/git" SWARMOPS_GIT_FIXTURES_CHECK="$RUNNER_TEMP/fx" \
            cargo nextest run --locked --all-features -p swarmops-testkit -p swarmops-git \
            --run-ignored ignored-only -E 'test(check_git_fixtures)' --no-capture
      # The testkit's fixture tests and the git import's (`raw`, `source`, and `convert` and
      # `import` once they exist), on the fixtures this git made.
      - name: The git import's tests on the fixtures git ${{ matrix.git }} made
        run: |
          SWARMOPS_GIT_FIXTURES_DIR="$RUNNER_TEMP/fx" \
            cargo nextest run --locked --all-features -p swarmops-testkit -p swarmops-git \
            -E 'test(/^git::/) | test(/^(raw|source|convert|import)::/)' --no-capture
      # The round trip's exports in this git's own words: `exported_repositories_pass_git_fsck`
      # runs git (so it is ignored in the default gate) on the committed archives, not on the
      # fixtures this git made, so that every git checks the same repositories. It refuses a git
      # other than the declared one (git-fixtures/GIT_VERSION) unless
      # SWARMOPS_GIT_FIXTURES_ANY_GIT=1, which the matrix's other gits need, as `just git-fixtures`
      # does.
      - name: The exports checked by git ${{ matrix.git }}'s fsck
        run: |
          SWARMOPS_GIT="$GIT_PREFIX/bin/git" SWARMOPS_GIT_FIXTURES_ANY_GIT=1 \
            cargo nextest run --locked --all-features -p swarmops-git \
            --run-ignored ignored-only -E 'test(exported_repositories_pass_git_fsck)' --no-capture
      # The remote suites (the transport, the mirror, the sync engine, the limits, the test kit's
      # server and the CLI's remote tests) and the serve suites (the test kit's serve site, git's
      # serve modules and the CLI's serve tests) with this git as the product's.
      - name: The remote suites with git ${{ matrix.git }}
        run: |
          SWARMOPS_GIT="$GIT_PREFIX/bin/git" \
            cargo nextest run --locked --all-features -p swarmops-testkit -p swarmops-git \
            -p swarmops-cli -E 'test(/^(transport|mirror|sync|limits|remote|remote_[a-z_]+|serve|serve_[a-z_]+)::/)'
      - name: Give the runner's user back the workspace
        if: ${{ always() }}
        run: |
          owner=$(stat -c %u:%g "$(dirname "$RUNNER_TEMP")")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  # This host's repositories, which tests read only with SWARMOPS_HOST_REPOS=1: bare mirrors in
  # /data/swarmops/host-repos, refreshed by scripts/host-repos.py from the list file there (one
  # source path a line, written with the defaults below when missing; edit it on the host). A
  # partial clone is passed over, with a warning. The sources are only read. Then
  # `host_repos::every_mirror_round_trips` imports each mirror's HEAD, verifies the store deep,
  # exports into an empty repository, has git fsck --strict it and imports the export again:
  # about 9 minutes for 3 mirrors and 2,324 commits at load 100, hence the ci-slow profile.
  host-repos:
    name: host repositories
    needs: slow
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci-slow
      HOST_REPOS: /data/swarmops/host-repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Write the list of this host's repositories, if missing
        run: |
          mkdir -p "$HOST_REPOS"
          if [ ! -f "$HOST_REPOS/list.txt" ]; then
            printf '/home/evo/dev/%s\n' traders agents upbit-broker ctrader-broker keiailab-mcp \
              >"$HOST_REPOS/list.txt"
          fi
          cat "$HOST_REPOS/list.txt"
      - name: Refresh the mirrors
        run: uv run --script scripts/host-repos.py "$HOST_REPOS/list.txt" "$HOST_REPOS"
      - name: Round-trip every mirror
        run: |
          SWARMOPS_HOST_REPOS=1 SWARMOPS_HOST_REPOS_DIR="$HOST_REPOS" \
            cargo nextest run --locked --all-features -p swarmops-git \
            -E 'test(/^host_repos::/)' --no-capture

  # The live round trip with GitHub (M13, roadmap Topology 2's criterion 4): `github_live`'s
  # ignored test clones the scratch repository the variable SWARMOPS_GITHUB_LIVE_REPO names,
  # pushes, merges three pull requests with `gh` and syncs. Without the variable, on a fork and
  # until the pilot sets it, the job shows as skipped. The token is the secret
  # SWARMOPS_GITHUB_TOKEN, given to the test step alone, as GH_TOKEN, which `gh` reads and the
  # test hands the binary by its name (--token-env GH_TOKEN): never an argument.
  github-live:
    name: live run on GitHub
    needs: slow
    if: ${{ !cancelled() && vars.SWARMOPS_GITHUB_LIVE_REPO != '' }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    # The token is read in an environment of its own, without protection rules.
    environment: github-live
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      # The runner's host provides gh; the test opens and merges the pull requests with it.
      - name: Check that gh is there
        run: |
          if ! command -v gh >/dev/null; then
            echo "::error::the runner's host lacks gh"
            exit 1
          fi
          gh --version
      - name: The live round trip with GitHub
        env:
          SWARMOPS_GITHUB_LIVE: "1"
          SWARMOPS_GITHUB_REPO: ${{ vars.SWARMOPS_GITHUB_LIVE_REPO }}
          GH_TOKEN: ${{ secrets.SWARMOPS_GITHUB_TOKEN }}
        run: |
          cargo nextest run --locked --all-features -p swarmops-cli --run-ignored ignored-only \
            -E 'test(=github_live::round_trip_with_github)' --no-capture

  # The benchmark gate (`just bench`): every criterion bench, its median against
  # bench/thresholds.toml, red on a regression over 20 % (scripts/bench-gate.py). Alone, before
  # the measurement cases: the other jobs share this host and reach load 319 together, which no
  # 20 % threshold survives, and the heavy lock serializes the host's measurements, not CI jobs.
  # `!cancelled()` runs it after a failed or skipped job too (github-live is skipped without its
  # variable). A missing lock directory fails the job; the load average before and after is
  # printed, and a loaded run fails, never passes. On failure the criterion results are uploaded.
  # The wait for the heavy lock is bounded apart from the run: HEAVY_LOCK_WAIT, 60 minutes, twice
  # the 29.4 minutes the gate waited in run 40785386333; a wait that runs out fails the job, and
  # the timeout is that wait plus the run's.
  bench-gate:
    name: bench gate
    needs: [fuzz, bench-compare, git-matrix, host-repos, github-live]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    # The lock wait's 60 minutes, plus twice the slower quiet baseline run (1,015 s,
    # bench/thresholds.toml) rounded up to 5 minutes, 35.
    timeout-minutes: 95
    env:
      CARGO_TERM_COLOR: always
      HEAVY_LOCK: /data/swarmops/locks/heavy.lock
      HEAVY_LOCK_WAIT: "3600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
          fallback: none
      - name: Check that the heavy lock's directory is there
        run: |
          if [ ! -d "$(dirname "$HEAVY_LOCK")" ]; then
            echo "::error::the runner's host lacks $(dirname "$HEAVY_LOCK")"
            exit 1
          fi
      - name: Load average before
        run: cut -d' ' -f1-3 /proc/loadavg
      - name: Run the benches and the gate under the heavy lock
        run: |
          # 1. Wait for the lock at most HEAVY_LOCK_WAIT seconds, apart from the run, on fd 9.
          [ -e "$HEAVY_LOCK" ] || : >>"$HEAVY_LOCK"
          exec 9<"$HEAVY_LOCK"
          start=$SECONDS
          if ! flock -w "$HEAVY_LOCK_WAIT" 9; then
            echo "::error::the heavy lock stayed held for $HEAVY_LOCK_WAIT s; nothing ran"
            exit 1
          fi
          echo "waited $((SECONDS - start)) s for the heavy lock"

          # 2. The run, holding the lock until this step's shell exits.
          just bench
      - name: Load average after
        if: ${{ !cancelled() }}
        run: cut -d' ' -f1-3 /proc/loadavg
      # The runner builds into its own CARGO_TARGET_DIR: bring the results to target/.
      - name: Collect the criterion results
        if: ${{ failure() }}
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "$CARGO_TARGET_DIR/criterion" ]; then
            mkdir -p target
            rm -rf target/criterion
            cp -r "$CARGO_TARGET_DIR/criterion" target/criterion
          fi
      - name: Upload the criterion results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # The measurement cases that `just check-ci-slow` leaves out (`just check-ci-perf`):
  # `remote_perf`'s five and `serve_perf`'s three, on 12,000 or 13,000 commits, and the checked
  # land on 12,000 changesets. They need a longer kill than the ci-slow profile's 20 minutes: in
  # the slow suite four ran into it and the other five took 65-76 % of it, and three take over 20
  # minutes even optimized. Optimized and one at a time, as `just perf` runs them, they took
  # 7,541 s in all, the longest 1,650 s (justfile, `check-ci-perf`). They fail on what they ran,
  # never on its time. Last and alone, after the bench gate, and under the heavy lock as it is:
  # the bench gate runs where it did, and neither waits for the lock the other holds.
  # `!cancelled()` runs it after a failed bench gate too. The wait for a lock that a measurement
  # outside CI holds is bounded as the bench gate's is, apart from the run, and fails the job when
  # it runs out. The `ci-perf` profile kills a hung case after 55 minutes and names it in the
  # JUnit report, which is uploaded.
  perf-cases:
    name: measurement cases
    needs: bench-gate
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    # The lock wait's 60 minutes, plus twice the cases' 7,541 s (251 minutes) and 5 for the
    # optimized build (62 s cold on this host at load 650), rounded up to 5 minutes, 260.
    timeout-minutes: 320
    env:
      CARGO_TERM_COLOR: always
      HEAVY_LOCK: /data/swarmops/locks/heavy.lock
      HEAVY_LOCK_WAIT: "3600"
      NEXTEST_PROFILE: ci-perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
          fallback: none
      - name: Check that the heavy lock's directory is there
        run: |
          if [ ! -d "$(dirname "$HEAVY_LOCK")" ]; then
            echo "::error::the runner's host lacks $(dirname "$HEAVY_LOCK")"
            exit 1
          fi
      - name: Load average before
        run: cut -d' ' -f1-3 /proc/loadavg
      - name: Run the cases under the heavy lock
        run: |
          # 1. Wait for the lock at most HEAVY_LOCK_WAIT seconds, apart from the run, on fd 9.
          [ -e "$HEAVY_LOCK" ] || : >>"$HEAVY_LOCK"
          exec 9<"$HEAVY_LOCK"
          start=$SECONDS
          if ! flock -w "$HEAVY_LOCK_WAIT" 9; then
            echo "::error::the heavy lock stayed held for $HEAVY_LOCK_WAIT s; nothing ran"
            exit 1
          fi
          echo "waited $((SECONDS - start)) s for the heavy lock"

          # 2. The run, holding the lock until this step's shell exits.
          just check-ci-perf
      - name: Load average after
        if: ${{ !cancelled() }}
        run: cut -d' ' -f1-3 /proc/loadavg
      # The runner builds into its own CARGO_TARGET_DIR: bring the report to target/.
      - name: Collect the JUnit report
        if: ${{ !cancelled() }}
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -f "$CARGO_TARGET_DIR/nextest/ci-perf/junit.xml" ]; then
            mkdir -p target/nextest/ci-perf
            cp "$CARGO_TARGET_DIR/nextest/ci-perf/junit.xml" target/nextest/ci-perf/
          fi
      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-perf
          path: target/nextest/ci-perf/junit.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
