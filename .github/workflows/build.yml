# The release build (RELEASE.md), reusable: `swarmops` and `so` for each Linux target, built,
# smoke-run and packed into an archive with its SHA-256, uploaded as an artifact of the calling
# run. release.yml calls it for a tag and for a rehearsal; its `packages` and `publish` jobs take
# the archives from there. One file holds the build steps, so every caller builds the same way at
# the same commit.
#
# Hardened as release.yml is: every action is pinned to a full commit SHA, the token has no
# permissions unless the job asks for one (`contents: read`, which the caller grants), the
# checkout keeps no credentials, no cache is restored, and no secret is used. The container
# digest and the rustup-init release are moved by hand: Dependabot does not read them.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: The workspace version the binaries print and the archives are named for
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # `swarmops` and `so` for one target, `cargo build --release --locked` on the pinned toolchain
  # without the `test-hooks` feature, smoke-run, then packed into
  # `swarmops-<version>-<target>.tar.gz` (both binaries, LICENSE, THIRD-PARTY-LICENSES, README.md,
  # CHANGELOG.md) with its SHA-256, which the `packages` job makes into a .deb and an .rpm. Inside
  # ubuntu:24.04 (glibc 2.39) as root: the steps install what they need with apt, and the last one
  # gives the runner's user back what they wrote into the mounted workspace and temporary
  # directory.
  build:
    name: build ${{ matrix.target }}
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          # Cross-compiled: Ubuntu's aarch64 GCC compiles the C sources of zstd-sys and blake3
          # and drives the link, which the toolchain's rust-lld does (a step below says why);
          # QEMU's user-mode emulator runs the binaries for the smoke test.
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
            run-with: qemu-aarch64 -L /usr/aarch64-linux-gnu
    env:
      CARGO_TERM_COLOR: always
      TARGET_TRIPLE: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      RUN_WITH: ${{ matrix.run-with }}
      # How cargo and the cc crate build for aarch64; a build for x86_64 reads none of them.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      # The newest glibc a binary may need: README's install section promises it.
      GLIBC_FLOOR: "2.34"
      # The toolchain and the build stay in the container's own filesystem, out of the mounted
      # home, workspace and temporary directory, and away from the runner's CARGO_TARGET_DIR.
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      CARGO_TARGET_DIR: /opt/target
      DEBIAN_FRONTEND: noninteractive
      # rustup-init, the release the steps install, by the SHA-256 static.rust-lang.org gives.
      RUSTUP_RELEASE: 1.29.2
      RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
    steps:
      # git before the checkout, which otherwise downloads the tree without its history: the
      # archive is dated at the tagged commit.
      - name: Install the compilers, QEMU and the tools the steps run
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates curl \
            file git jq "${packages[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins, for the target
        run: |
          init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_RELEASE/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $init" | sha256sum --check --strict -
          chmod +x "$init"
          "$init" -y --no-modify-path --profile minimal --default-toolchain none
          rm -f -- "$init"
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "$CARGO_HOME/bin" >>"$GITHUB_PATH"
          rustup toolchain install --no-self-update
          rustup target add "$TARGET_TRIPLE"
      # GNU ld, which aarch64-linux-gnu-gcc runs by default, flags no version need WEAK, nor
      # does Ubuntu's LLD 18, so the binaries they link need glibc 2.39 (the smoke test says
      # why the flag matters). The aarch64 build is linked by the toolchain's own rust-lld,
      # which links the x86_64 build and flags those needs: GCC runs it for `-fuse-ld=lld`
      # from the toolchain's `gcc-ld` directory, as rustc has GCC do for x86_64.
      - name: Link the aarch64 build with the toolchain's rust-lld
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          gcc_ld="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin/gcc-ld"
          if [ ! -x "$gcc_ld/ld.lld" ]; then
            echo "::error::the pinned toolchain has no rust-lld at $gcc_ld/ld.lld"
            exit 1
          fi
          "$gcc_ld/ld.lld" --version
          flags="-C link-arg=-fuse-ld=lld -C link-arg=-B$gcc_ld"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=$flags" >>"$GITHUB_ENV"
      # SWARMOPS_BUILD_CHANNEL=release, read at compile time, is what makes a binary a release's:
      # only these builds, of this workflow, set it (the `build-macos` job's too), and `so update`
      # and automatic update act on no other build. It changes nothing `--version` prints.
      - name: Build swarmops and so
        env:
          SWARMOPS_BUILD_CHANNEL: release
        run: cargo build --release --locked -p swarmops-cli --bins --target "$TARGET_TRIPLE"
      # Each binary prints the tag's version and needs no glibc newer than GLIBC_FLOOR; then a
      # store is made, committed to, read and deep-verified, with every SWARMOPS_TEST_* hook set,
      # which a release build ignores (SECURITY.md). Honoured, the first would abort `init` at
      # its first filesystem call, the second fail the commit's, the third write the file it
      # names, and the fourth sign the changeset in 2001; and SWARMOPS_TEST_VERSION, set where
      # the version is asked for, would make a binary print 0.0.1. Automatic update is off for
      # every run: a binary under test looks for no release.
      - name: Smoke-test the binaries
        env:
          SWARMOPS_AUTO_UPDATE: "off"
        run: |
          read -ra run_with <<<"$RUN_WITH"
          bin="$CARGO_TARGET_DIR/$TARGET_TRIPLE/release"
          file "$bin/swarmops" "$bin/so"
          for name in swarmops so; do
            # The glibc a binary needs is the newest of readelf's version needs
            # (`Name: GLIBC_2.34  Flags: none`) that is not flagged WEAK. A need is flagged WEAK
            # when every symbol bound to it is a weak reference and the linker marks it so
            # (rust-lld, which links both builds, does; GNU ld and Ubuntu's LLD 18 do not).
            # ld.so starts such a binary on a glibc without that version all the same,
            # saying on stderr "weak version `GLIBC_2.39' not found", and resolves those symbols
            # to null, which Rust's std checks before it calls `pidfd_spawnp` or `pidfd_getpid`
            # (GLIBC_2.39).
            needs=$(readelf --version-info --wide "$bin/$name")
            glibc=$(sed -n -E '/ Flags: [^:]*WEAK/d; s/.* Name: GLIBC_([0-9][0-9.]*) .*/\1/p' \
              <<<"$needs" | sort -V | tail -n 1)
            weak=$(sed -n -E 's/.* Name: GLIBC_([0-9][0-9.]*) +Flags: [^:]*WEAK.*/\1/p' \
              <<<"$needs" | sort -V | tail -n 1)
            if [ -z "$glibc" ]; then
              echo "::error::readelf lists no glibc version that $name needs"
              exit 1
            fi
            newest=$(printf '%s\n' "$glibc" "$GLIBC_FLOOR" | sort -V | tail -n 1)
            if [ "$newest" != "$GLIBC_FLOOR" ]; then
              echo "::error::$name needs glibc $glibc, newer than the $GLIBC_FLOOR README promises"
              exit 1
            fi
            printed=$(SWARMOPS_TEST_VERSION=0.0.1 "${run_with[@]}" "$bin/$name" --version)
            if [ "$printed" != "swarmops $VERSION" ]; then
              echo "::error::$name --version printed '$printed', not 'swarmops $VERSION'"
              exit 1
            fi
            echo "$name: '$printed', glibc $glibc at most${weak:+, $weak for weak symbols only}"
          done

          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          store="$smoke/store"
          before=$(date +%s)
          # Runs one command of a binary under test and prints its envelope, which must be a
          # success that the jq filter $1 holds for.
          expect() {
            local filter=$1 status=0
            shift
            envelope=$("${run_with[@]}" "$@") || status=$?
            printf '%s\n' "$envelope"
            if [ "$status" -ne 0 ] || ! jq -e --argjson before "$before" ".ok and ($filter)" \
              >/dev/null <<<"$envelope"; then
              echo "::error::'$*' exited $status, or its envelope fails '$filter'"
              exit 1
            fi
          }
          SWARMOPS_TEST_CRASH_AT=1 expect '.result.changesets == 0' \
            "$bin/swarmops" init "$store" --name smoke
          printf '%s\n' '[{"path": "hello.txt", "op": "put", "content": {"inline": "hello\n"}}]' \
            >"$smoke/changes.json"
          SWARMOPS_TEST_FAIL_AT=1:persistent SWARMOPS_TEST_FS_CALLS="$smoke/fs-calls" \
            SWARMOPS_TEST_NOW=1000000000 expect '.result.files_changed == 1' \
            "$bin/so" --repo "$store" --as release/smoke commit -m smoke \
            --changes "$smoke/changes.json" --advance main
          if [ -e "$smoke/fs-calls" ]; then
            echo "::error::SWARMOPS_TEST_FS_CALLS was honoured"
            exit 1
          fi
          # `$before` is jq's: `expect` binds it.
          # shellcheck disable=SC2016
          expect '.result.signatures.committer.secs >= $before' \
            "$bin/swarmops" --repo "$store" show main
          expect '.result.content == "hello\n"' "$bin/swarmops" --repo "$store" cat main:hello.txt
          expect '.result.problems == []' "$bin/so" --repo "$store" verify --deep
      # Reproducible: the entries sorted, owned by root and dated at the tagged commit. The archive
      # holds exactly these files, or the step fails: THIRD-PARTY-LICENSES, the licenses of the
      # crates compiled into the binaries, is among them (`just check` keeps it in step with
      # Cargo.lock).
      - name: Pack the archive
        id: pack
        run: |
          name="swarmops-$VERSION-$TARGET_TRIPLE"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/$name" dist
          install -m 0755 "$CARGO_TARGET_DIR/$TARGET_TRIPLE/release/swarmops" \
            "$CARGO_TARGET_DIR/$TARGET_TRIPLE/release/so" "$stage/$name/"
          install -m 0644 LICENSE THIRD-PARTY-LICENSES README.md CHANGELOG.md "$stage/$name/"
          mtime=$(git -c safe.directory="$PWD" log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -C "$stage" -cf - "$name" | gzip -9 --no-name >"dist/$name.tar.gz"
          tar -tvzf "dist/$name.tar.gz"
          expected=$(printf '%s\n' "$name/" "$name/CHANGELOG.md" "$name/LICENSE" "$name/README.md" \
            "$name/THIRD-PARTY-LICENSES" "$name/so" "$name/swarmops" | LC_ALL=C sort)
          if [ "$(tar -tzf "dist/$name.tar.gz" | LC_ALL=C sort)" != "$expected" ]; then
            echo "::error::$name.tar.gz does not hold exactly its directory, both binaries," \
              "LICENSE, THIRD-PARTY-LICENSES, README.md and CHANGELOG.md (its listing is above)"
            exit 1
          fi
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          echo "name=$name" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # Root wrote the checkout, dist/ and the staging directory; the runner's user deletes them
      # before its next job.
      - name: Give the runner's user back the workspace
        if: ${{ always() }}
        run: |
          owner=$(stat -c %u:%g "$(dirname "$RUNNER_TEMP")")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
