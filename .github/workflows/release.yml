# The release (RELEASE.md): a pushed `v*` tag is checked against the workspace version, `stable`
# and CHANGELOG.md; `just check` runs on the tagged commit; `swarmops` and `so` are built for two
# Linux targets and for Apple silicon Macs, and smoke-run; each Linux target's archive is made
# into a .deb and an .rpm, which are installed in containers; the server's container image is
# built from those packages and tested; and the tag's GitHub release is published with the
# archives, the packages, the image's OCI archive, `SHA256SUMS`, and the version's CHANGELOG.md
# section as its notes.
#
# A run started by hand (workflow_dispatch) on a branch rehearses the builds, the packages and
# their installs for the workspace version, and publishes nothing: `publish` runs for a pushed tag
# only, and neither the tag checks nor `just check` (CI's) run.
#
# Hardened as ci.yml is: every action is pinned to a full commit SHA (its version in the trailing
# comment; Dependabot updates both), the token has no permissions unless a job asks for one,
# `actions/checkout` keeps no credentials, and CI's zizmor job audits this file too. The one
# write grant, `contents: write`, is the publishing job's, and that job builds nothing: it checks
# the archives the build jobs made and uploads them with `gh`. No job restores a cache, so what a
# release ships is built from the tagged commit and Cargo.lock alone, never from a cache another
# run could have written: the Linux builds in a container made for the run, the macOS build with
# a cargo home of its own, emptied first (see its job for what of that Mac it does use). No
# secret is used but each job's own token.
#
# Where jobs run: on the maintainers' own host, through the self-hosted runners labelled
# `swarmops-local` that run CI. A tag push is a maintainer's, never a fork's. The release gate
# builds into a target directory of its own under the job's temporary directory, not the runner's
# CARGO_TARGET_DIR that CI's runs reuse, and deletes it at the end. The build jobs (build.yml, which
# release.yml calls) run inside an ubuntu:24.04 container pinned by digest, the image whose glibc
# README's install section is measured against; they install the cross compiler, QEMU and the pinned
# toolchain there and build into the container's own filesystem, which goes with the container. The
# packages jobs run on the runner, which starts their install containers. Every image digest has
# one source, packaging/entrance/Dockerfile, which Dependabot moves; `just check` fails while a
# workflow names another. The rustup-init release is build.yml's, moved by hand with
# scheduled.yml's.
#
# The macOS build alone runs elsewhere: on the maintainers' own Mac, through a self-hosted runner
# labelled `macos-local`, natively and in no container, with that Mac's Xcode command line tools
# and its rustup, which installs the toolchain rust-toolchain.toml pins or finds it installed.
# Until that runner is registered and online its job waits, and with it `publish`, which needs it:
# no release is published without the macOS archive.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# A release runs to its end: another run for the same tag (a re-run) waits for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: tag, version and notes
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, so that the next steps find the tagged commit on `stable`.
          fetch-depth: 0
      # The release notes are the version's CHANGELOG.md section, from below its heading,
      # `## [X.Y.Z] - YYYY-MM-DD`, to the next `## ` heading, with its relative links made
      # absolute, to the tag's files; then how to check a download, and the file's link
      # definitions. A version with a pre-release part (`0.2.0-rc.1`) is published as a
      # pre-release. A rehearsal takes the workspace version and checks nothing else.
      - name: The tag names the workspace version, and CHANGELOG.md has its section
        id: version
        run: |
          python3 -I - <<'EOF'
          import os
          import re
          import sys
          import tomllib

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          prerelease = "-" in version.split("+")[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\nprerelease={str(prerelease).lower()}\n")
          if os.environ["GITHUB_EVENT_NAME"] != "push":
              print(f"::notice::a rehearsal of {tag} at {version}: nothing is checked or published")
              sys.exit(0)

          if tag != f"v{version}":
              fail(f"this tag is not v{version}, the workspace version in Cargo.toml (RELEASE.md)")

          with open("CHANGELOG.md", encoding="utf-8") as changelog:
              lines = changelog.read().splitlines()
          heading = f"## [{version}]"

          def is_heading(line):
              return line == heading or line.startswith(f"{heading} ")

          start = next((i for i, line in enumerate(lines) if is_heading(line)), None)
          if start is None:
              fail(f"CHANGELOG.md has no '{heading} - YYYY-MM-DD' section (RELEASE.md)")
          after = range(start + 1, len(lines))
          end = next((i for i in after if lines[i].startswith("## ")), len(lines))
          definition = re.compile(r"\[[^\]]+\]: \S")
          body = "\n".join(line for line in lines[start + 1 : end] if not definition.match(line))
          body = body.strip("\n")
          if not body.strip():
              fail(f"CHANGELOG.md's '{heading}' section is empty")
          files = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          body = re.sub(
              r"\]\((?![a-z][a-z0-9+.-]*:|#|/)([^)\s]+)\)",
              lambda link: f"]({files}{link[1]})",
              body,
              flags=re.IGNORECASE,
          )
          check = (
              "Check a download against `SHA256SUMS` with"
              " `sha256sum --check --ignore-missing SHA256SUMS` (on macOS:"
              " `shasum -a 256 --check --ignore-missing SHA256SUMS`). The archives carry no"
              f" build-provenance attestation yet ([RELEASE.md]({files}RELEASE.md))."
          )
          notes = f"{body}\n\n---\n\n{check}\n"
          definitions = "\n".join(line for line in lines if definition.match(line))
          if definitions:
              notes += f"\n{definitions}\n"
          if len(notes) > 125000:
              fail(f"the release notes are {len(notes)} characters, more than a release's 125000")
          notes_file = os.path.join(os.environ["RUNNER_TEMP"], "notes.md")
          with open(notes_file, "w", encoding="utf-8") as out:
              out.write(notes)
          print(notes)
          EOF
      - name: The tagged commit is on stable
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/stable; then
            echo "::error::stable does not hold the tagged commit $GITHUB_SHA (RELEASE.md)"
            exit 1
          fi
      # `just golden-frozen`: every golden file of the previous release tag is unchanged (the
      # checkout above fetched every tag). Python alone, as this job installs no `just`.
      - name: The released golden files are unchanged
        if: github.event_name == 'push'
        run: python3 -I scripts/golden-frozen.py check
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 14

  # The release gate: `just check`, as ci.yml's `check` job runs it (the same tool versions: move
  # them together), on the tagged commit. Without CI's cache or the runner's target directory, so
  # its build is a clean one. A rehearsal leaves it to CI.
  check:
    name: just check
    needs: version
    if: github.event_name == 'push'
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146,cargo-deny@0.20.2
          fallback: none
      - run: just check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-release-check
          path: ${{ runner.temp }}/release-target/nextest/ci/junit.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      # Several gigabytes the runner's next job would otherwise delete.
      - name: Delete the clean build
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/release-target"

  # The archives, one per target, built by build.yml (its comments say how).
  build:
    needs: version
    # A local path, not `owner/repo/...@sha`: the build steps stay in one file, read at this same
    # commit, so a tag builds exactly what it tags.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  # `swarmops` and `so` for Apple silicon Macs (aarch64-apple-darwin): the `build` job's commands
  # and its smoke test, run natively on the maintainers' Mac, with no container: the linker and
  # the C compiler (zstd-sys and blake3 compile C) are that Mac's Xcode command line tools, the
  # toolchain the one rust-toolchain.toml pins, which the runner's rustup installs. Built into a
  # target directory of its own under the job's temporary directory, emptied first and deleted
  # at the end, so that nothing an earlier run built is linked in. MACOSX_DEPLOYMENT_TARGET pins
  # the oldest macOS the binaries start on to rustc's own default for the target
  # (`rustc --print deployment-target`), for the C sources as well: the smoke test reads it back
  # from each binary. Packed as the Linux archives are, same layout and names, and published
  # with them. The steps are written for macOS's own tools: /bin/bash 3.2, BSD userland,
  # `shasum`, and the python3 of the command line tools (3.9).
  build-macos:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: [self-hosted, macos-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # One target, named as the `build` job names its two: scripts/third-party-licenses.py
          # reads every `- target:` of this file, and THIRD-PARTY-LICENSES, which this archive
          # carries too, covers the crates compiled for each. There is no Intel Mac
          # (x86_64-apple-darwin) build: nothing here could run one.
          - target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      TARGET_TRIPLE: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # The oldest macOS the binaries run on, which the install guide promises: macOS 11, the
      # first for Apple silicon.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner must be an Apple silicon Mac, as the binaries are run here, and have the
      # tools the steps run: jq ships with macOS 15 and newer, the others with the command line
      # tools.
      # Nothing of the runner user's cargo is to reach the build, which no container keeps out
      # here. CARGO_HOME is a directory of this run under the job's temporary directory, emptied
      # first: cargo downloads the crates Cargo.lock names into it and reads no registry, no
      # git checkout and no configuration from `~/.cargo`. Cargo also reads `.cargo/config.toml`
      # of every directory above the workspace, the home directory's among them when the runner
      # works below it, and a handful of variables (RUSTFLAGS, RUSTC_WRAPPER, RUSTUP_TOOLCHAIN,
      # any CARGO_*): the step fails when it finds one of either, naming it. What the job does
      # take from this Mac is rustup with its toolchains (the pinned version, installed here or
      # found installed), the command line tools' linker and C compiler, and the system's SDK.
      - name: Install the toolchain rust-toolchain.toml pins, for the target
        run: |
          if [ "$(uname -sm)" != "Darwin arm64" ]; then
            echo "::error::this runner is '$(uname -sm)', not an Apple silicon Mac (Darwin arm64)"
            exit 1
          fi
          for tool in cc codesign file git jq lipo otool python3 rustup shasum tar; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::this runner has no $tool"
              exit 1
            fi
          done
          sw_vers
          foreign=$(env | sed -n -E \
            's/^((CARGO_|RUSTC|RUSTFLAGS|RUSTDOCFLAGS|RUSTUP_TOOLCHAIN)[A-Za-z0-9_]*)=.*/\1/p' |
            grep -v -x -e CARGO_TERM_COLOR || true)
          if [ -n "$foreign" ]; then
            echo "::error::this runner's environment sets ${foreign//$'\n'/ }, which the build" \
              "would follow"
            exit 1
          fi
          above=$(dirname "$GITHUB_WORKSPACE")
          while :; do
            for config in "$above/.cargo/config.toml" "$above/.cargo/config"; do
              if [ -e "$config" ]; then
                echo "::error::cargo would read $config, which is not the tagged commit's"
                exit 1
              fi
            done
            if [ "$above" = / ]; then
              break
            fi
            above=$(dirname "$above")
          done
          cargo_home="$RUNNER_TEMP/release-cargo-home"
          rm -rf -- "$cargo_home"
          mkdir -p "$cargo_home"
          export CARGO_HOME="$cargo_home"
          echo "CARGO_HOME=$cargo_home" >>"$GITHUB_ENV"
          rustup toolchain install --no-self-update
          rustup target add "$TARGET_TRIPLE"
          target_dir="$RUNNER_TEMP/release-target"
          rm -rf -- "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >>"$GITHUB_ENV"
      # With SWARMOPS_BUILD_CHANNEL=release, as the `build` job builds.
      - name: Build swarmops and so
        env:
          SWARMOPS_BUILD_CHANNEL: release
        run: cargo build --release --locked -p swarmops-cli --bins --target "$TARGET_TRIPLE"
      # Each binary is for arm64 alone, links against nothing but the system's own libraries
      # (/usr/lib and /System/Library, which every Mac has), starts on macOS from
      # MACOSX_DEPLOYMENT_TARGET on (its LC_BUILD_VERSION's `minos`), carries the linker's ad-hoc
      # signature, without which no arm64 Mac starts it, and prints the tag's version. Then the
      # `build` job's store test, command for command, with its SWARMOPS_TEST_VERSION and with
      # automatic update off as there: move them together.
      - name: Smoke-test the binaries
        env:
          SWARMOPS_AUTO_UPDATE: "off"
        run: |
          bin="$CARGO_TARGET_DIR/$TARGET_TRIPLE/release"
          file "$bin/swarmops" "$bin/so"
          for name in swarmops so; do
            archs=$(lipo -archs "$bin/$name")
            if [ "$archs" != arm64 ]; then
              echo "::error::$name is built for '$archs', not for arm64 alone"
              exit 1
            fi
            otool -L "$bin/$name"
            foreign=$(otool -L "$bin/$name" |
              awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library)\// { print $1 }')
            if [ -n "$foreign" ]; then
              echo "::error::$name links against more than the system's libraries:" \
                "${foreign//$'\n'/ }"
              exit 1
            fi
            minos=$(otool -l "$bin/$name" | awk '
              $1 == "cmd" { build = $2 == "LC_BUILD_VERSION" }
              build && $1 == "minos" { print $2 }')
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$name starts on macOS '$minos' or newer, not $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
            codesign --verify --strict --verbose=2 "$bin/$name"
            printed=$(SWARMOPS_TEST_VERSION=0.0.1 "$bin/$name" --version)
            if [ "$printed" != "swarmops $VERSION" ]; then
              echo "::error::$name --version printed '$printed', not 'swarmops $VERSION'"
              exit 1
            fi
            echo "$name: '$printed', arm64, macOS $minos or newer, system libraries only"
          done

          smoke="$RUNNER_TEMP/smoke"
          rm -rf -- "$smoke"
          mkdir -p "$smoke"
          store="$smoke/store"
          before=$(date +%s)
          # Runs one command of a binary under test and prints its envelope, which must be a
          # success that the jq filter $1 holds for.
          expect() {
            local filter=$1 status=0
            shift
            envelope=$("$@") || status=$?
            printf '%s\n' "$envelope"
            if [ "$status" -ne 0 ] || ! jq -e --argjson before "$before" ".ok and ($filter)" \
              >/dev/null <<<"$envelope"; then
              echo "::error::'$*' exited $status, or its envelope fails '$filter'"
              exit 1
            fi
          }
          SWARMOPS_TEST_CRASH_AT=1 expect '.result.changesets == 0' \
            "$bin/swarmops" init "$store" --name smoke
          printf '%s\n' '[{"path": "hello.txt", "op": "put", "content": {"inline": "hello\n"}}]' \
            >"$smoke/changes.json"
          SWARMOPS_TEST_FAIL_AT=1:persistent SWARMOPS_TEST_FS_CALLS="$smoke/fs-calls" \
            SWARMOPS_TEST_NOW=1000000000 expect '.result.files_changed == 1' \
            "$bin/so" --repo "$store" --as release/smoke commit -m smoke \
            --changes "$smoke/changes.json" --advance main
          if [ -e "$smoke/fs-calls" ]; then
            echo "::error::SWARMOPS_TEST_FS_CALLS was honoured"
            exit 1
          fi
          # `$before` is jq's: `expect` binds it.
          # shellcheck disable=SC2016
          expect '.result.signatures.committer.secs >= $before' \
            "$bin/swarmops" --repo "$store" show main
          expect '.result.content == "hello\n"' "$bin/swarmops" --repo "$store" cat main:hello.txt
          expect '.result.problems == []' "$bin/so" --repo "$store" verify --deep
      # The Linux archives' layout, written by Python's tarfile, since macOS's tar has none of
      # GNU tar's --sort, --owner or --mtime: the directory then its files in byte order of
      # their names, each owned by 0:0 with no user or group name, dated at the tagged commit,
      # the binaries and the directory 0755 and the documents 0644, in GNU format; gzip at level
      # 9 with no name and no time in its header. So the archive's bytes follow from the files'
      # bytes, the version and the commit's date, and from this Python's zlib; nothing of the
      # runner's clock, user or umask is in it. The archive holds exactly these files, or the
      # step fails, and the binaries are unpacked again and compared with the built ones.
      - name: Pack the archive
        id: pack
        run: |
          name="swarmops-$VERSION-$TARGET_TRIPLE"
          mkdir -p dist
          mtime=$(git log -1 --format=%ct)
          NAME="$name" MTIME="$mtime" BIN="$CARGO_TARGET_DIR/$TARGET_TRIPLE/release" \
            python3 -I - <<'EOF'
          import gzip
          import os
          import tarfile

          name = os.environ["NAME"]
          mtime = int(os.environ["MTIME"])
          binaries = os.environ["BIN"]
          files = {binary: (os.path.join(binaries, binary), 0o755) for binary in ("swarmops", "so")}
          for document in ("LICENSE", "THIRD-PARTY-LICENSES", "README.md", "CHANGELOG.md"):
              files[document] = (document, 0o644)


          def entry(path, kind, mode, size):
              info = tarfile.TarInfo(path)
              info.type = kind
              info.mode = mode
              info.size = size
              info.mtime = mtime
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              return info


          with open(f"dist/{name}.tar.gz", "wb") as out:
              header = {"filename": "", "mtime": 0}
              with gzip.GzipFile(mode="wb", compresslevel=9, fileobj=out, **header) as packed:
                  with tarfile.open(fileobj=packed, mode="w", format=tarfile.GNU_FORMAT) as tar:
                      tar.addfile(entry(name, tarfile.DIRTYPE, 0o755, 0))
                      for member in sorted(files):
                          source, mode = files[member]
                          with open(source, "rb") as data:
                              size = os.fstat(data.fileno()).st_size
                              info = entry(f"{name}/{member}", tarfile.REGTYPE, mode, size)
                              tar.addfile(info, data)
          EOF
          tar -tvzf "dist/$name.tar.gz"
          expected=$(printf '%s\n' "$name/" "$name/CHANGELOG.md" "$name/LICENSE" "$name/README.md" \
            "$name/THIRD-PARTY-LICENSES" "$name/so" "$name/swarmops" | LC_ALL=C sort)
          if [ "$(tar -tzf "dist/$name.tar.gz" | LC_ALL=C sort)" != "$expected" ]; then
            echo "::error::$name.tar.gz does not hold exactly its directory, both binaries," \
              "LICENSE, THIRD-PARTY-LICENSES, README.md and CHANGELOG.md (its listing is above)"
            exit 1
          fi
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf -- "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf "dist/$name.tar.gz" -C "$unpacked"
          for binary in swarmops so; do
            cmp "$CARGO_TARGET_DIR/$TARGET_TRIPLE/release/$binary" "$unpacked/$name/$binary"
            "$unpacked/$name/$binary" --version
          done
          (cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          echo "name=$name" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # A few hundred megabytes with the downloaded crates, and dist/ in the workspace, which
      # the next run's checkout would otherwise find.
      - name: Delete the build
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/release-target" "$RUNNER_TEMP/release-cargo-home" \
            "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/unpacked" dist

  # One target's .deb and .rpm, made by scripts/packages.py from that target's archive alone (its
  # binaries and files, byte for byte, dated at the tagged commit), then each installed with dpkg
  # or rpm in a container pinned by digest (packaging/entrance/Dockerfile's): Debian 12, and
  # AlmaLinux 9, whose glibc 2.34 is README's floor. Both binaries must print the version, the
  # packages verify (rpm's seeing a tampered binary) and remove cleanly. The aarch64 packages are
  # installed for aarch64 (Debian's multiarch, an AlmaLinux root of that architecture, whose glibc
  # rpm checks the dependencies against) and run under QEMU; those two containers download from
  # the distributions' mirrors.
  # Beside them, the server kit's .deb and .rpm (`swarmops-server`, from packaging/server/ at the
  # tagged commit, dated alike). On x86_64 they are installed beside the client's with apt-get and
  # dnf, which download their dependencies: the account, directories and units must exist and
  # removing them must keep /srv/so. They hold no binary, so the aarch64 job does not install them.
  # On the runner itself, which starts the containers with docker: the containers write nothing
  # back, as they mount the packages read-only.
  packages:
    name: packages ${{ matrix.target }}
    needs: [version, build]
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swarmops-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: archive
      - name: Make the client's and the server kit's .deb and .rpm
        run: |
          archive="swarmops-$VERSION-$TARGET_TRIPLE.tar.gz"
          (cd archive && sha256sum --check --strict -- "$archive.sha256")
          python3 -I scripts/packages.py build "archive/$archive" dist
          cd dist
          for package in *.deb *.rpm; do
            sha256sum -- "$package" >"$package.sha256"
          done
          cat -- *.sha256
      - name: Install, run, verify and remove them in containers
        run: python3 -I scripts/packages.py smoke "$VERSION" dist/*.deb dist/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmops-${{ needs.version.outputs.version }}-${{ matrix.target }}-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The server's container image: one image index of x86_64 and aarch64, which
  # scripts/server-image.py builds from both targets' `swarmops` and `swarmops-server` .deb alone
  # (packaging/container/Dockerfile copies no file in) and writes as an OCI archive, a release
  # asset. Every layer is built here (`--fresh`), Debian's packages fetched from its mirror. The
  # aarch64 half runs its install under QEMU's user-mode emulator, which a pinned image registers
  # with the host's binfmt_misc when the host lacks it. Then the image's cases run on the x86_64
  # half in containers without a network, the last building the index again: both archives must
  # be equal, byte for byte. On the runner, whose docker holds images in containerd's store.
  image:
    name: server image
    needs: [version, packages]
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # By digest, the one packaging/entrance/Dockerfile names (its `qemu-binfmt` stage).
      BINFMT_IMAGE: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swarmops-${{ needs.version.outputs.version }}-*-packages
          merge-multiple: true
          path: packages
      - name: Check the packages against the SHA-256 their jobs wrote
        run: |
          cd packages
          sha256sum --check --strict -- *.sha256
      - name: Register QEMU for the aarch64 half
        run: |
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            docker run --rm --privileged "$BINFMT_IMAGE" --install arm64
          fi
      - name: Build the image index
        run: |
          mkdir dist
          python3 -I scripts/server-image.py build --fresh "$VERSION" packages \
            "dist/swarmops-server-$VERSION-oci.tar"
      - name: Test the image, and build it again
        run: |
          python3 -I scripts/server-image.py test "$VERSION" packages \
            --archive "dist/swarmops-server-$VERSION-oci.tar"
          cd dist
          sha256sum -- *-oci.tar >"swarmops-server-$VERSION-oci.tar.sha256"
          cat -- *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmops-${{ needs.version.outputs.version }}-server-image
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # For a pushed tag only: a rehearsal publishes nothing.
  publish:
    name: publish the release
    needs: [version, check, build, build-macos, packages, image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, swarmops-local] # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: write # `gh release create`: the release, its notes and its assets
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # The archives, the packages and the image: `swarmops-<version>-<target>` for the two Linux
      # targets and the macOS one, the Linux ones' `-packages`, and
      # `swarmops-<version>-server-image`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swarmops-*
          merge-multiple: true
          path: dist
      # Every archive and package is checked against the SHA-256 its job wrote before anything is
      # uploaded. `gh` creates the release as a draft, uploads the assets, then publishes it.
      - name: Check the archives and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          sha256sum --check --strict -- *.sha256
          cat -- *.sha256 >SHA256SUMS
          cat SHA256SUMS
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --verify-tag --title "SwarmOps $VERSION" \
            --notes-file ../notes/notes.md "${flags[@]}" -- *.tar.gz *.deb *.rpm *-oci.tar SHA256SUMS
