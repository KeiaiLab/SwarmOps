# listed bench that did not run or a bench in neither table.
#
# Measured 2026-10-28 under the host's heavy lock with the soak timer stopped and no CI job:
# run 2 (start load 4.40, at most 16.0 over the run, 1,015 s) and run 3 (start load 4.78, 1,003 s;
# other builds took the 1-minute load over 10 for 39 of its 100 samples). An earlier run beside
# another heavy measurement spread 26 benches past 10 % and was discarded.
# A bench whose two medians differ by 10 % or more is in [skip], its spread the reason. Moving a
# bench in either direction, or raising a baseline, takes two new quiet runs: a new `measured`
# and `run`. A red run is a failure to investigate, not a reason to skip its bench.
# Written by `scripts/bench-gate.py baseline` from two quiet runs; the inclusion rule:
# medians less than 10 % apart enter [bench] with their mean.

