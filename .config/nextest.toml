# The two 32-process contention measurements (`crates/swarmops-store/tests/contention.rs` and
# `crates/swarmops-cli/tests/contention.rs`) share the host's disk, and each asserts that no
# writer waits out the store's 10 s lock timeout: they run one after another, never at once,
# so that neither slows the other's lock passes towards that timeout (docs/perf.md, "M1 (CLI
# level)"). The rest of the suite still runs beside them. Each crate's integration tests are one
# binary (`tests/all.rs`), so the group takes the tests by name: those of the `contention`
# modules.

[test-groups]
contention = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^contention::/)'
test-group = 'contention'

# CI's profile: ci.yml sets `NEXTEST_PROFILE=ci` for `just check`, whose workspace run then uses
# it (its one-test release run asks for the default profile). Every test runs even after one
# fails, none is retried, and the run's JUnit report is target/nextest/ci/junit.xml. A test
# still running after 10 minutes is killed and reported as timed out, the JUnit report naming
# it: the longest regular test takes about 10 s on this host and under 2 minutes even with the
# host badly overloaded, so only a hang gets there, and the job's 30-minute timeout would leave
# no report at all. The default profile's settings and overrides (the contention group above)
# apply to it as well.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

# The weekly slow suite's profile (scheduled.yml runs `just check-ci-slow` with
# `NEXTEST_PROFILE=ci-slow`): the ci profile, with a test killed after 20 minutes instead. Its
# longest tests, `faults::fail_at_every_call_reports_honestly`,
# `power_loss::power_loss_images_recover_a_prefix_with_every_acknowledged_commit_at_every_cut`
# (both run 8 stores at once) and `compaction_preserves_lookups_proptest` at 2,000 cases, take
# 85-115 s on this host at 32 test threads. The 2-vCPU runner ran the same 8-child sweep harness
# 2.2× slower than this host (the regular suite's order-check sweep, 30 s against 14 s on the
# first CI run), and two of this host's CPUs at load 240 ran the earlier sweeps 3.4× slower: 3-5
# minutes a sweep there, so only a hang reaches 20. The tests sum to about 980 s here: 20-30
# minutes on two runner threads, up to 35 with one killed hang, which the job's 45 minutes hold
# with the build; a sweep past about 6 minutes in the junit-slow report means raising this and
# timeout-minutes together. Its JUnit report is target/nextest/ci-slow/junit.xml.
[profile.ci-slow]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 20 }

# The weekly measurement cases' profile (scheduled.yml runs `just check-ci-perf` with
# `NEXTEST_PROFILE=ci-perf`): the ci profile, with a test killed after 55 minutes instead. Its
# cases import 12,000 commits and run optimized, one at a time; the longest,
# `serve_perf::clone_against_git`, took 1,650 s on this host (docs/perf.md, "v0.7.0"), past the
# ci-slow profile's 20 minutes, and 55 minutes is twice that, so only a hang reaches it. Its
# JUnit report is target/nextest/ci-perf/junit.xml.
[profile.ci-perf]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 55 }
