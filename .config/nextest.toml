# The two 32-process contention measurements (`crates/swarmops-store/tests/contention.rs` and
# `crates/swarmops-cli/tests/contention.rs`) share the host's disk, and each asserts that no
# writer waits out the store's 10 s lock timeout: they run one after another, never at once,
# so that neither slows the other's lock passes towards that timeout (docs/perf.md, "M1 (CLI
# level)"). The rest of the suite still runs beside them. Each crate's integration tests are one
# binary (`tests/all.rs`), so the group takes the tests by name: those of the `contention`
# modules.

# The default profile's bound, which `just perf` and a local `just check-slow` run under (no
# `NEXTEST_PROFILE`): a test still running after 2 hours is killed and reported as timed out. No
# bound at all let a perf case whose import failed run for 13 h and 5 h. The longest case,
# `serve_perf::clone_against_git`, took 1,650 s optimized on this host (docs/perf.md, "v0.7.0"),
# the ci-perf profile's 55 minutes is twice that, and the import cases' own deadline is 3,600 s,
# so 2 hours holds a loaded run and only a hang reaches it. The ci, ci-slow and ci-perf profiles
# set their own, shorter bounds, which this does not change.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 120 }

[test-groups]
contention = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^contention::/)'
test-group = 'contention'

# macOS alone (`platform`): Linux, where CI runs, takes neither of the two overrides below, and its
# runs are scheduled as they were.
#
# On APFS the suite's own tests starve one another. The volume takes one change of its namespace
# (mkdir, create, link, unlink, rename) at a time, and a flush to stable storage there
# (`F_FULLFSYNC`, which `sync_all` issues on macOS) holds every such call on the volume while it
# runs, so past about 8 threads the calls queue: what the volume does in a second stays about the
# same however many tests share it, and each test takes that many times longer. With 24 tests at
# once (macOS 27, an M-series laptop of 24 CPUs) 31 tests reached the ci profile's 10-minute kill,
# none of them hung: each passes alone. With 8 at once the run took 38.5 min and one still
# reached it (`counted_work::status_of_an_untouched_workspace_reads_no_object`, 47 s alone), with
# `ws_sigkill`'s three at 390 to 541 s.
#
# So the tests that are many threads at the volume count as that many of the run's threads
# (`threads-required`), and the others run beside them as before:
#
# - The sweeps count as 8. Each runs 8 children or threads at once (the kits' `AT_ONCE`), each
#   on a store of its own that it copies in and removes; they are taken by the words their names
#   share, which also takes some quick tests beside them, at no cost that shows. The same 8 goes
#   to the tests that make and remove tens of thousands of files each: the counted-work gates
#   (a clone of the large store's 100,000 object files a test, removed at its end), `ws_sigkill`'s
#   three (2,000 files committed a round, a flush each; 235 to 253 s with nothing but one another
#   on the volume) and swarmops-git's histories of 10,000 changesets.
# - `serve_lock`'s two run with nothing beside them. On a bench directory without their stores
#   the first builds them, and the build's `serve --prepare` flushes each of 10,000 loose objects:
#   the two took 222 s from nothing with the volume to themselves (23 to 28 s with the stores
#   built), and 262 and 280 s with the stores built beside 7 other tests.
#
# With these the same run passed in 34 min, its longest test 269 s (`ws_sigkill`'s) and the next
# 156 s. A test of a new name that turns out to be as heavy joins the filter it fits.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'test(/^serve_lock::/)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'test(/power_loss|crash|sweep|killed|sigkill|at_any_|at_every_|recursion/) | test(/^faults::/) | (test(/^counted_work::/) & !test(/^counted_work::an_a1_twin/)) | test(/^export::mac_memos::an_/)'
threads-required = 8

# CI's profile: ci.yml sets `NEXTEST_PROFILE=ci` for `just check`, whose workspace run then uses
# it (its one-test release run asks for the default profile). Every test runs even after one
# fails, none is retried, and the run's JUnit report is target/nextest/ci/junit.xml. A test
# still running after 10 minutes is killed and reported as timed out, the JUnit report naming
# it: most regular tests take seconds on this host, and the longest, swarmops-git's import crash
# sweep (`sweeps::import_crashing_at_any_call_resumes_to_the_same_state`), about 97 s a format at
# load 430, so only a hang gets there, and the job's 30-minute timeout would leave no report at
# all. The default profile's settings and overrides (the contention group above) apply to it as
# well.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

# `sigkill::sigkill_mid_commit_500_times` (both formats) took 577-599 s in a loaded check-slow on
# this host, at the profile's 10-minute kill, before the M16 design §2 ran two reader processes
# beside it: it gets 20 periods. The test is ignored, so this binds a run of the ignored tests
# under this profile, such as `NEXTEST_PROFILE=ci just check-slow`; no CI job is one: `just
# check` runs no ignored test, and the weekly `ci-slow` profile, which inherits this override,
# kills at 20 periods already.
[[profile.ci.overrides]]
filter = 'test(sigkill_mid_commit_500_times)'
slow-timeout = { period = "60s", terminate-after = 20 }

# The weekly slow suite's profile (scheduled.yml runs `just check-ci-slow` with
# `NEXTEST_PROFILE=ci-slow`): the ci profile, with a test killed after 20 minutes instead. Its
# longest tests, `faults::fail_at_every_call_reports_honestly`,
# `power_loss::power_loss_images_recover_a_prefix_with_every_acknowledged_commit_at_every_cut`
# (both run 8 stores at once) and `compaction_preserves_lookups_proptest` at 2,000 cases, take
# 85-115 s on this host at 32 test threads. The 2-vCPU runner ran the same 8-child sweep harness
# 2.2× slower than this host (the regular suite's order-check sweep, 30 s against 14 s on the
# first CI run), and two of this host's CPUs at load 240 ran the earlier sweeps 3.4× slower: 3-5
# minutes a sweep there, so only a hang reaches 20. The tests sum to about 980 s here: 20-30
# minutes on two runner threads, up to 35 with one killed hang, which the job's 45 minutes hold
# with the build; a sweep past about 6 minutes in the junit-slow report means raising this and
# timeout-minutes together. Its JUnit report is target/nextest/ci-slow/junit.xml.
[profile.ci-slow]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 20 }

# The weekly measurement cases' profile (scheduled.yml runs `just check-ci-perf` with
# `NEXTEST_PROFILE=ci-perf`): the ci profile, with a test killed after 55 minutes instead. Its
# cases import 12,000 or 13,000 commits or seed 12,000 changesets, and run optimized, one at a
# time; the longest, `serve_perf::clone_against_git`, took 1,650 s on this host (docs/perf.md,
# "v0.7.0"), past the ci-slow profile's 20 minutes, and 55 minutes is twice that, so only a hang
# reaches it. Its JUnit report is target/nextest/ci-perf/junit.xml.
[profile.ci-perf]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 55 }
