# The cargo-deny policy of the workspace's lockfile, and of the fuzz crate's (fuzz/Cargo.lock),
# whose one license exception is in fuzz/deny.exceptions.toml, beside its manifest.
# bench/compare/deny.toml repeats every line of this file, beside that harness's own entries.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
